# The scheduler's OWN schedule entry -- it eats its own dogfood and runs a
# nightly job against the backlog in .scheduler/FOCUS.md. Tier 2 only
# (there's no fast web tracker to sweep).
#
# This file lives at .scheduler/schedule.conf (the project's own
# self-contained scheduler folder, deliberately OUTSIDE .claude/ -- see
# "Permission gate" resolution 2026-07-20 in FOCUS.md: unattended `claude -p`
# hard-refuses Edit/Write under .claude/** as a "sensitive file", confirmed by
# a controlled A/B test, so anything an unattended run needs to write must
# live outside .claude/ entirely) and is symlinked to schedule/scheduler.conf
# so bin/sync-crontab.sh finds it -- the reference for the per-project folder
# model every other project is migrating onto (see FOCUS.md focus item 2).

PROJECT="scheduler"
PROJECT_REPO_PATH="$HOME/Documents/Projects/scheduler"
# Self-contained-folder model: FOCUS.md/QUESTIONS.md live here, OUTSIDE
# .claude/ (see note above -- that's now the point, not just organization).
# bin/sync-crontab.sh reads this to aim the focus/+questions/ symlinks.
# Default (unset) is ".claude" for not-yet-migrated projects -- those
# projects hit the same permission gate on their own .claude/QUESTIONS.md
# today; migrating them to SCHEDULER_SUBDIR=".scheduler" is the fix.
SCHEDULER_SUBDIR=".scheduler"

# No Tier 1 sweep for the scheduler.
SWEEP_JOB_NAME=""
SWEEP_SCRIPT=""
SWEEP_CRON=""

# 2026-07-28: these three named `scheduler-nightly-batch` /
# scheduler-nightly-batch-loop.sh / 03:00 long after that arrangement was
# retired. scheduler is dispatched by the USAGE-PACED RUNNER (weight 3 in
# schedule/_paced.conf, wrapper scheduler-dev-cycle.sh, JOB_NAME
# `scheduler-paced-dev`), and sync-crontab.sh's is_paced() branch has been
# suppressing the fixed 03:00 line the whole time -- verified 2026-07-28 via
# `crontab -l | grep scheduler` (two managed lines, neither a batch).
#
# So the stale names cost nothing in the crontab, but they were NOT harmless:
# `scheduler status`'s run ledger resolves a project's log as
# ~/.local/share/$BATCH_JOB_NAME/run.log, so it was reading
# scheduler-nightly-batch/run.log -- last written 2026-07-19, ending FAILED --
# and rendering scheduler's own row from a 9-day-dead log. bin/scheduler:1941
# added a `stale-` prefix so it stopped ASSERTING an outage, which was the
# right call for a general sensor, but the underlying pointer was simply
# wrong. Pointing it at the real job fixes the cause rather than softening
# the symptom.
#
# 2026-07-29: the sentence above ("has been suppressing the fixed 03:00 line
# the whole time") stopped being true and is left standing as the record of
# WHY, because the failure is instructive. Suppression is keyed on membership
# in a paced rotation file. When mandark's scheduler self-dev went dark
# (58d6495) by COMMENTING OUT its `scheduler|1|3` line, this project stopped
# being a member of the only file sync-crontab.sh read -- so the suppression
# this conf depends on silently lapsed, and the next `--apply` would have
# auto-staggered a fixed nightly scheduler-dev-cycle.sh line instead. The
# decision to stop self-dev on mandark and the mechanism that would have
# restarted it were the same edit. Fixed the same day: membership is now the
# union across every host's rotation (lib/paced-conf.sh's
# paced_membership_set), so dexter's `scheduler|1|3` keeps the suppression
# alive everywhere. Witness: tests/sync-crontab-paced-witness.sh.
#
# BATCH_CRON stays EMPTY on purpose: the paced runner owns dispatch, and a
# literal time here would only be suppressed again. JOB_NAME/SCRIPT are kept
# populated because the status ledger reads them -- blanking all three would
# make `last_run_verdict` return `nojob` and drop scheduler out of the ledger
# entirely, trading a wrong row for no row, which is the worse failure for a
# tool whose whole point this week has been surfacing absence.
# verified 2026-07-28 via tail ~/.local/share/scheduler-paced-dev/run.log
#   -> "==== done 2026-07-28T07:45:57-05:00 ===="
BATCH_JOB_NAME="scheduler-paced-dev"
# BATCH_SCRIPT WAS "/home/zach/.local/bin/scheduler-dev-cycle.sh" and is GONE.
# It was the legacy-wrapper path and it named a MANDARK home: on
# scheduler@monkey (uid 3011, provisioned 2026-08-11) that file does not
# exist. Worse than missing -- bin/scheduler-run REFUSES a tier whose SCRIPT
# is set, by design, so leaving it would have meant "configured, armed, and
# refused at every dispatch". Migrating to BATCH_PROMPT is what MIGRATION.md
# asks of exactly this tier.
BATCH_CRON=""
ANSWER_CHANNEL="issues"

# --- which account and host own this job (2026-08-11) -----------------------
# CRON_HOST is checked FIRST by sync-crontab.sh and continues cleanly, so a
# sync from mandark does not error on an account that exists only on monkey.
CRON_HOST="monkey"
CRON_ACCOUNT="scheduler"

# THE CIRCULARITY, STATED IN THE FILE RATHER THAN IN A REVIEW COMMENT.
# This account develops the dispatcher that dispatches it AND the other
# eleven. A bad merge to bin/usage-paced-runner.sh or bin/scheduler-run does
# not fail this project -- it stops every account on the host, including the
# one that would fix it. Zach was shown that trade on 2026-08-11 and chose to
# arm both this and realisateur, with enforce_admins turned on first as the
# containment. The brief carries the consequence, because a rule that lives
# only in a decision nobody can read is not a rule.
BATCH_PROMPT="You are scheduler. You are the mechanism: you dispatch every
other self-dev account on this host, and your queue is hf7y/scheduler.

1. Work the issue queue:
     gh issue list --repo hf7y/scheduler --state open

   No starting issue is named here on purpose -- a literal number goes stale
   the day it closes and keeps being dispatched anyway.

2. TRIAGE IS NOT FIFO. Ask of each open issue whether its premise still holds.
   An issue whose premise expired should be CLOSED, naming the decision or
   commit that expired it. Closing three dead issues beats half-building a
   fourth.

3. CLOSE WHAT YOU RESOLVE, with a comment naming what landed and where. Zach
   will not do it, and a queue nobody closes stops meaning anything.

4. YOU CAN STOP YOUR OWN HEART. bin/usage-paced-runner.sh, bin/scheduler-run
   and lib/sweep-loop-common.sh are the code that dispatches you. A change
   that breaks them takes down all twelve accounts and leaves nothing running
   to repair it -- recovery is a human on mandark. For those three files
   specifically: never merge on a red or missing check, add a witness under
   tests/ that observes the new behaviour BEFORE changing it, and run
   tests/run-all.sh yourself rather than trusting CI alone. If a change to
   them cannot be witnessed, that is a DECISION line for a human, not a merge.

5. THE ROSTER IS THE HEADLINE. Issues 79, 80 and 81 -- one ROSTER file
   replacing three that must agree, and dose <project> converging a host to
   it. bin/roster-target.sh scores it and reads 0 of 6. It DELETES ITSELF on
   2026-08-24 and goes red on every pull request from that date until someone
   does. Read 79 before starting: it warns that removing a row from
   _paced.conf ARMS a nightly cron rather than disarming it, and that a ROSTER
   sitting beside the files it replaces is a fourth opinion, strictly worse
   than three."
BATCH_MAX_TURNS="120"
USES_STANDING_RULES=1

# AUTONOMY_TIER (declared 2026-07-24, paced cycle -- axis 1.5, formalizing
# EXISTING policy, no behavior change): "high" -- matches the
# already-decided FOCUS.md "Target UX" mockup (2026-07-20) and this
# project's own documented push/merge policy (FOCUS.md: may push directly
# to origin/main, paced cycles merge into local main automatically).
AUTONOMY_TIER="high"

# REPO_URL added 2026-08-05: required now that GitHub is the front door for
# both questions and ideas (`gh_repo_slug` derives owner/repo from it). Its
# absence was invisible while `scheduler -i scheduler` wrote to a local
# FOCUS.md, and would have become "scheduler: scheduler has no REPO_URL"
# the first time anyone filed a note against the scheduler itself.
REPO_URL="https://github.com/hf7y/scheduler.git"
