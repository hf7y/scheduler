# tests.yml -- run tests/run-all.sh on every PR into main and every push to main.
#
# WHY THIS EXISTS. tests/run-all.sh has auto-discovered every witness since
# 2026-07-28, but nothing invoked it except a person who remembered to -- the
# same defect run-all.sh was written to retire, one level up. The cost is on the
# record: tests/runner-conf-host-witness.sh was red on main for six days
# (2026-08-05 to 08-11) and was filed (hf7y/scheduler#58) only after being
# mistaken for expected output. A suite nobody is shown is documentation.
#
# IT GATES, and which checks do is one settings change from whatever a comment
# here would say -- so it is measured, not written down:
# tests/branch-protection-witness.sh (hf7y/scheduler#87).

name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # CARRY FIRST, ON MAIN ONLY (#315). Until now nothing DID the carry the
  # witness below detects, so a carried file's PR stayed red until a human
  # pushed bashified by hand -- and it could not be carried before the merge
  # without putting a version into the build that no branch develops. This
  # writes to `bashified`, never to `main`.
  carry:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: git fetch --no-tags origin +refs/heads/bashified:refs/remotes/origin/bashified
      - name: Give git an identity for the carry commit
        run: |
          git config --global user.email "ci@scheduler.invalid"
          git config --global user.name  "scheduler CI"
      - run: bash bin/carry.sh --apply

  suites:
    needs: [carry]
    # `needs` on a job skipped for pull_request would skip this one too.
    if: always() && (needs.carry.result == 'success' || needs.carry.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ONE command, and deliberately no per-witness loop here. run-all.sh is
      # already that loop -- it collects failures rather than stopping at the
      # first, and exits 1 on "no witnesses found" so an empty glob is a failure
      # rather than a green run that tested nothing. Re-implementing either rule
      # in YAML would give this repo two definitions of a failing suite, and the
      # one in the workflow is the one nobody runs locally. A `run:` block
      # executes under `bash -e`, so that exit 1 is what reds this job.
      #
      # NOTHING IS INSTALLED ABOVE, and that is a finding rather than an
      # omission. The suite is hermetic: every witness builds its fixtures in
      # mktemp dirs, the three that touch `gh` stub it, no witness invokes
      # `crontab`, and `shellcheck` appears only as source/disable directives.
      # Checked by running the whole suite under a scrubbed
      # HOME (no ~/.gitconfig, so no user identity and no init.defaultBranch,
      # which is a runner's condition): the result was identical to a normal
      # run. If that stops being true, the fix is an install step here, not a
      # witness taught to skip.
      #
      # ONE EXCEPTION, and it is the point of it: branch-protection-witness.sh
      # reads branch protection from the API, because no fixture can answer what
      # gates `main`. A CI GITHUB_TOKEN is not an admin, so here it says BLIND
      # and passes zero checks rather than green.
      - name: Run every witness in tests/
        run: bash tests/run-all.sh
