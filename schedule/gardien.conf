# gardien -- rsync+hardlink nightly backup of mandark/dexter onto a local
# RAID array, scaffolded by realisateur from a dropped inbox note.
# Registered 2026-07-22.
#
# Follows the crt/realisateur/groc-mangr/vim-arcade precedent: git repo
# pushed to a LOCAL bare remote (no credentials/network needed), generic
# bin/scheduler-run entrypoint, joins the usage-paced governor as a Tier 2
# participant (see schedule/_paced.conf) instead of a fixed cron time.
#
# Scope is unattended-safe because .claude/commands/nightly-batch.md and
# FOCUS.md both insist all real rsync logic stay exercised against temp
# directories in tests -- no unattended run should touch a real RAID mount
# or a real host until Zach has verified the base loop against real
# hardware himself.

PROJECT="gardien"
PROJECT_KEY="gardien"

CRON_HOST="monkey"
CRON_ACCOUNT="gardien"
# Set 2026-08-28 (hf7y/scheduler#328). Unset, bin/roster-diff.sh derived
# `parked` for a project that is enabled, armed and dispatching, so exit 0 was
# unreachable; and bin/scheduler's state_home() fell back to $HOME, which is
# hf7y/scheduler#33. SELFDEV_IN_ACCOUNT is pinned because CRON_ACCOUNT is also
# read by lib/sweep-loop-common.sh's auto-detection: setting it alone would
# have flipped this job's workspace from the dedicated clone to the account
# checkout, unwitnessed, on a dispatch-critical path (standing rule 4). The
# pin keeps today's behaviour exactly; moving these three onto their own
# checkouts is a separate change that needs a live witness.
SELFDEV_IN_ACCOUNT=0

PROJECT_REPO_PATH="$HOME/Documents/Projects/gardien"

REPO_URL="https://github.com/hf7y/gardien.git"
REPO_SUBDIR="."

# ===========================================================================
# TIER 1 -- bug sweeper: DISABLED. gardien has no live web tracker.
# ===========================================================================
SWEEP_JOB_NAME=""

# ===========================================================================
# TIER 2 -- overnight batch: paced participant (see schedule/_paced.conf).
# ===========================================================================
BATCH_JOB_NAME="gardien-nightly-batch"
BATCH_PROMPT="/nightly-batch"
BATCH_CRON="auto"
BATCH_MAX_TURNS="120"


# 2026-08-17: these rules were written for every dispatched account, and four
# projects were not reading them. hf7y/realisateur#127.
USES_STANDING_RULES=1
