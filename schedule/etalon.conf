# etalon -- the reference standard the estate measures itself against: one
# prose guard (bin/markdown-cost.sh, called via .github/workflows/guard.yml),
# one exit-code vocabulary. Registered 2026-09-06 per Zach's ruling on
# hf7y/scheduler#595 (realisateur `/ideate`, "the opposite of folding it into
# realisateur -- realisateur's guards move INTO etalon").
#
# BLAST RADIUS, NOT A REGULAR REPO. 25 files across the estate point at this
# repo already, and .github/workflows/guard.yml is what 15 other repos pin
# their merge gate to. A change to canon/ or a ratchet here is a fleet-wide
# change the instant it lands on main, not a change to this repo alone. This
# repo's own main branch CI last ran 2026-08-30 and was green -- if a run
# here ever finds it isn't, that is a DECISION line for a human, not
# something to quietly work around.
#
# 4 draft PRs opened from other repos' work (hf7y/etalon#22, #25, #32, #34)
# sat unmerged since 2026-08-30 because nothing here had a merger -- that gap
# is why this account exists.

PROJECT="etalon"
PROJECT_KEY="etalon"

PROJECT_REPO_PATH="$HOME/Documents/Projects/etalon"
REPO_URL="https://github.com/hf7y/etalon.git"
REPO_SUBDIR="."

# --- which account and host own this job -------------------------------
# etalon@monkey, uid 3000-3099, provisioned per hf7y/scheduler#595's ordered
# registration (account, both clones, git credential helper -- BEFORE this
# row is armed). See hf7y/scheduler#595: `do_live` exits 5 BROKEN on a `live`
# row whose account is missing, which is why schedule/ROSTER carries this
# project `parked` until that account exists.
CRON_HOST="monkey"
CRON_ACCOUNT="etalon"

SWEEP_JOB_NAME=""
BATCH_JOB_NAME="etalon-nightly-batch"
BATCH_PROMPT="You are etalon. You maintain the reference standard 15 other
repos pin their merge gate to, and your queue is hf7y/etalon.

1. Work the issue queue:
     gh issue list --repo hf7y/etalon --state open

   No starting issue is named here on purpose -- a literal number goes stale
   the day it closes and keeps being dispatched anyway.

2. TRIAGE IS NOT FIFO. Ask of each open issue whether its premise still
   holds. Close what has expired, naming the decision or commit that expired
   it.

3. MERGE WHAT ARRIVES. Other repos open draft PRs here carrying fixes to
   canon/ or the guard scripts -- that is this repo's normal inbound, not an
   anomaly. Review each, land it if it is correct, and say why if it is not.

4. CLOSE WHAT YOU RESOLVE, with a comment naming what landed and where.

5. YOUR BLAST RADIUS IS THE WHOLE ESTATE. A change to bin/markdown-cost.sh,
   bin/lib/exit-codes.sh, or anything under canon/ reaches every repo that
   calls .github/workflows/guard.yml@main the instant it merges -- there is
   no per-repo copy to catch a mistake first. Never merge on a red or
   missing check. If a change would weaken the guard or the exit vocabulary
   for every caller at once, that is a DECISION line for a human, not a
   merge."
BATCH_MAX_TURNS="120"
USES_STANDING_RULES=1
