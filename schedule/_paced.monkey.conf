# Participants for usage-paced-runner.sh -- HOST-SCOPED to `monkey`.
#
# Format and semantics: see schedule/_paced.conf's header. Not repeated here.
#
# WHY THIS HOST EXISTS (2026-08-03, Zach-directed; realisateur/MONKEY.md):
# self-dev leaves mandark. `monkey` is a VirtualBox guest on dexter's Windows
# host, one unix user per project, and this is the file that decides what it
# dispatches. `usage-paced-runner.sh` resolves _paced.$(hostname -s).conf and
# FALLS BACK to the shared _paced.conf when there is no host file -- on a new
# host that fallback is not a default, it is mandark's rotation. This file
# existing is what makes that impossible.
#
# TWO ENABLED ROWS since 2026-08-03. The one-row rule this header used to
# state ("before there is a second, the dispatcher topology has to be
# decided") was answered rather than waived -- realisateur/MONKEY.md section
# 9.1, Zach-directed.
#
# The short version, because the answer is the reason a reader may add a
# third row without asking: N dispatchers was never the thing protecting the
# quota. `bin/usage-gate.sh` is, and it protects it by probing Anthropic's
# unified rate-limit headers, which are ACCOUNT-WIDE -- every host, every unix
# user, every interactive session, already true of mandark+dexter sharing one
# budget. A second account sees the first account's spend. Adding rows scales
# how many things ask permission, not what they are asking about.
#
# THE ONE THING TO CHECK BEFORE ROW #3. `usage-paced-runner.sh` locks
# `$HOME/.local/share/$JOB_NAME/run.lock` -- $HOME-scoped, so per ACCOUNT.
# Two accounts can dispatch in the same tick. That race is bounded by
# USAGE_CEILING (0.85, i.e. 15% of headroom to eat) and PACED_MAX_PER_TICK=1
# at `0 */6`, which the ceiling absorbs for two. It is NOT obvious it absorbs
# five, and the lock is where to look first.
#
# ABSOLUTE PATH, deliberately. This file is parsed with `while IFS='|' read`,
# NOT sourced, so "$HOME" would arrive as five literal characters. Its sibling
# schedule/<project>.conf files ARE sourced and DO expand $HOME. One repo, two
# conventions, and neither file shows the difference -- MONKEY.md section 4.
#
# WEIGHT 1, not the 2 mandark's row carried. Weight is a share of the
# rotation; with a single participant it means nothing, and carrying a 2
# across would forge a judgment about a pre-migration ecosystem (the rule
# _paced.dexter.conf's own scheduler block states: "no weights remove").
#
# `bin/scheduler-run` is the generic entrypoint and the correct caller here:
# ecosim.conf and bibliothecaire.conf both set BATCH_PROMPT and no
# BATCH_SCRIPT, and scheduler-run REFUSES a tier that still has a legacy
# wrapper, so a wrong call fails loud.
#
# Each row's path is that PROJECT ACCOUNT's own clone. It is not a typo that
# the same script appears twice under different homes: the runner is invoked
# by the project user's crontab, as that user, against that user's checkout.
ecosim|1|1|/home/ecosim/Documents/Projects/scheduler/bin/scheduler-run ecosim batch
bibliothecaire|1|1|/home/bibliothecaire/Documents/Projects/scheduler/bin/scheduler-run bibliothecaire batch
