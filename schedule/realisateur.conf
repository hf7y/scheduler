# realisateur -- takes Zach's chaotically-dropped ideas (echoed text files,
# PNGs, whatever) and infers/wires them into real, scaffolded projects,
# registering each with this same scheduler ecosystem. Registered 2026-07-19.
#
# Follows the crt precedent exactly: git repo pushed to a LOCAL bare remote
# (no credentials/network needed), generic bin/scheduler-run entrypoint (no
# bespoke ~/.local/bin wrapper logic beyond the thin path-safety exec), joins
# the usage-paced governor as a Tier 2 participant (see schedule/_paced.conf)
# instead of a fixed cron time.
#
# Scope is unattended-safe because .claude/commands/nightly-batch.md only
# processes the inbox + FOCUS.md and treats anything irreversible (real
# GitHub credentials, messages to people, spending money) as a
# QUESTIONS.md case rather than acting on it directly.

PROJECT="realisateur"
PROJECT_KEY="realisateur"

# FOCUS/QUESTIONS migrated .claude/ -> .scheduler/ 2026-07-26 (the
# harness sensitive-file gate blocks unattended writes to .claude/
# paths; same move as scheduler/aedile/chezz -- see realisateur commit
# fa222cb and scheduler BLOCKERS.md ## wtul for the 2026-07-24 origin).
SCHEDULER_SUBDIR=".scheduler"

PROJECT_REPO_PATH="$HOME/Documents/Projects/realisateur"

REPO_URL="https://github.com/hf7y/realisateur.git"
REPO_SUBDIR="."
ANSWER_CHANNEL="issues"

# --- which account and host own this job (2026-08-11) -----------------------
# realisateur had NO CRON_ACCOUNT until today, which is hf7y/realisateur#111
# and #117: a correctly-filed realisateur item had a queue and no worker, and
# every guard that reads "whose ~/.local/share holds this job's run log"
# answered empty. The account exists now -- realisateur@monkey, uid 3010,
# provisioned 2026-08-11 by bin/setup-selfdev-project.sh.
#
# CRON_HOST is load-bearing, not decorative: sync-crontab.sh checks it FIRST
# and `continue`s cleanly, and without it every sync from mandark would error
# "CRON_ACCOUNT=realisateur is not a user on mandark". Host first, account
# second, in that order.
CRON_HOST="monkey"
CRON_ACCOUNT="realisateur"

# ===========================================================================
# TIER 1 -- bug sweeper: DISABLED. realisateur has no live web tracker.
# ===========================================================================
SWEEP_JOB_NAME=""

# ===========================================================================
# TIER 2 -- overnight batch: paced participant (see schedule/_paced.conf).
# ===========================================================================
BATCH_JOB_NAME="realisateur-nightly-batch"
# WAS "/nightly-batch" -- a slash command that INFERS IDEAS from inbox
# artifacts and scaffolds new projects. That was the right job when this conf
# was armed nowhere and realisateur had no worker. It is the wrong job now:
# hf7y/realisateur#111 (Zach, 2026-08-11, Option A) created this account to
# DRAIN the queue, not to grow it. 29 open issues at the time of writing.
#
# Same shape as ecosim/vim-arcade/bibliothecaire deliberately: one prompt
# source, one failure mode. The STANDING RULES block is NOT retyped here --
# USES_STANDING_RULES=1 below prepends schedule/_standing-rules.md at dispatch
# (#71). Retyping it into each conf is the defect that extraction retired.
BATCH_PROMPT="You are realisateur. You own the toolchain every other self-dev
account consumes, and your queue is hf7y/realisateur.

1. Work the issue queue:
     gh issue list --repo hf7y/realisateur --state open

   No starting issue is named here on purpose: a literal issue number goes
   stale the day it closes and keeps being dispatched anyway. If nothing
   stands out, take the OLDEST open issue not already labelled in-progress.

2. TRIAGE IS NOT FIFO. Before picking, read the open titles and ask of each:
   does its premise still hold? An issue whose premise expired should be
   CLOSED, saying which decision or commit expired it. Closing three dead
   issues beats half-building a fourth.

3. CLOSE WHAT YOU RESOLVE. Zach, standing instruction: agents should close
   issues that are clearly resolved, not leave them to Zach -- he will not,
   and they will clutter. Close with a comment naming what landed and where.

4. YOUR BLAST RADIUS IS THE WHOLE ESTATE, and this is the one way your queue
   differs from every other account's. Twelve accounts run tools this repo
   ships. A bad merge here does not break realisateur, it breaks all of them
   at once, and the account that could repair it is downstream of the same
   build. Two things hold that line and neither is optional: main requires
   green checks with enforce_admins ON since 2026-08-11, and the verb build
   verifies every verb a manifest promises before switching, discarding a
   partial build rather than serving it. Do not weaken either. If a change
   would, that is a DECISION line for a human, not a merge.

5. THE SUNSET IS REAL. bin/served-not-cloned.sh deletes itself on 2026-08-24
   and goes red on every pull request from that date until someone does. It
   reads 1 of 9 today. Work that scoreboard when the queue offers nothing
   more pressing -- it is the estate's own statement of what is missing."
BATCH_CRON="auto"
BATCH_MAX_TURNS="120"
USES_STANDING_RULES=1

# AUTONOMY_TIER (declared 2026-07-24, paced cycle -- axis 1.5, formalizing
# EXISTING policy, no behavior change): "high" -- matches the
# already-decided FOCUS.md "Target UX" mockup (2026-07-20).
AUTONOMY_TIER="high"
