# Paced-runner tick meta -- HOST-SCOPED to `monkey`.
#
# Overrides schedule/_runner.conf PER FIELD; the shared file is sourced first.
# State ONLY what differs -- a field restated here is a second copy that will
# drift.
#
# Same cadence and per-tick cap as mandark ran. NOT raised because the host is
# new and fast: mandark, dexter and monkey all draw on ONE weekly quota, so a
# faster tick here does not add throughput, it just wins a race against the
# other two. Changing these is a decision about how the quota is SPLIT, which
# is not a knob to turn for speed. (_runner.dexter.conf's header makes the
# same argument for two hosts; it is now three.)
RUNNER_CRON="0 */6 * * *"
RUNNER_ENV="PACED_MAX_PER_TICK=1"
