# Paced-runner tick meta -- HOST-SCOPED to `monkey`.
#
# Overrides schedule/_runner.conf PER FIELD; the shared file is sourced first.
# State ONLY what differs -- a field restated here is a second copy that will
# drift.
#
# RAISED 2026-08-04 to every 30 minutes. Read the retired argument below before
# lowering or raising it again -- it was right when written and its premise has
# since become false, which is the only reason this changed.
#
# WHAT IT USED TO SAY, and why it no longer holds:
#
#   "Same cadence and per-tick cap as mandark ran. NOT raised because the host
#    is new and fast: mandark, dexter and monkey all draw on ONE weekly quota,
#    so a faster tick here does not add throughput, it just wins a race against
#    the other two. Changing these is a decision about how the quota is SPLIT."
#
# There is no longer a race to win. Re-probed 2026-08-04 before this edit:
#   mandark  `crontab -l | grep -c scheduler-paced-runner:RUNNER` -> 0
#            (_runner.mandark.conf sets RUNNER_CRON="", retired by conf)
#   dexter   same probe -> 0
# monkey is the ONLY host that dispatches anything. A faster tick here takes
# throughput from nobody.
#
# AND THE CRON WAS NEVER THE THING PROTECTING THE QUOTA. bin/usage-gate.sh is:
# it probes Anthropic's account-wide rate-limit headers and HOLDs above the
# ceiling or the even-burn line, on every tick, whatever the cron says. The
# cron rate only decides how often we ASK; the gate decides how often the
# answer is yes. Raising the ask-rate on the only dispatching host converts
# quota that would have expired unused into work, which is the whole thesis
# usage-paced-runner.sh was built on.
#
# The immediate reason: five sourced-corpus research requests for the `dog`
# piece (bibliothecaire issues #8-#12, filed 2026-08-04) wanted to be through
# the queue by morning. At `0 */6` with PACED_MAX_PER_TICK=1 that is four
# dispatches a day and the batch would have taken until the 5th.
#
# REVERTING is one line back to `0 */6 * * *` plus `sync-crontab.sh --apply`
# as EACH account on monkey -- the crontab is generated per user, so a repo
# revert alone changes nothing until that runs. If the retired argument ever
# becomes true again (a second host starts dispatching), revert first and
# argue after: the race it describes is real whenever there is more than one.
# REVERTED to `0 */6` on 2026-08-04, ~9h after being raised. The raise did its
# job -- four of the five corpus requests (bibliothecaire #8-#12) were delivered
# within about half an hour -- and then kept charging for it. Once the queue had
# no ACTIONABLE work left, every tick still dispatched an agent for ~80s to
# re-confirm a blocker it already knew about (#10 cannot reach WebSearch/WebFetch
# in that environment), which at 48 ticks a day is about an hour of agent time
# per day spent learning nothing. The verdict rule stops re-dispatch WITHIN a
# tick; it cannot stop cron from firing the next one.
#
# Do not restate the gate's knobs here. schedule/_usage.conf is the one place
# USAGE_CEILING and USAGE_RUSH_BEFORE_RESET_MIN are set; this file's copy of
# them was 0.99/10080 against the real 0.90/720 for 24 days.
#
# Raising the ask-rate is still the right lever when there is real work queued
# and this is the only dispatching host -- that reasoning was sound and is kept
# below. It is the standing rate that was wrong. If you raise it again, raise it
# for a known backlog and put it back when the backlog clears.
#
# RUNNER_CRON RETIRED 2026-08-22 (hf7y/scheduler#81): this host's tick rate
# is now per-project in schedule/ROSTER, applied by `dose <project>
# --apply`, so a host override of the cadence no longer belongs here. The
# history above (raise/revert, the headroom correction) still applies to
# understanding how this host's rate was reasoned about before the switch.
RUNNER_ENV="PACED_MAX_PER_TICK=1"
