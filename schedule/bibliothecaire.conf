# bibliothecaire -- the ecosystem's librarian: (a) operations/cybernetics
# knowledge base seeded from realisateur's UNIVERSE.md, deliverable =
# sourced quotes with real attribution published as a consumable file
# (crt's idle-bait rotation is the first consumer); (b) crt's book-catalog
# knowledge wing, merged in from crt's parked catalog split -- LATER
# milestone. Vision: Zach's 2026-07-26 /ideate session (realisateur
# .scheduler/FOCUS.md same date). Scaffolded + registered 2026-07-26 by
# realisateur's nightly, after step 0 renamed the prior holder of this
# name to quatre-vingt-douze.
#
# Follows the quatre-vingt-douze precedent: local bare remote, generic
# bin/scheduler-run entrypoint, paced participant in schedule/_paced.conf
# at LOW weight (Zach's stated pacing call: the vision is still forming --
# UNIVERSE.md's convergence test -- so it iterates slowly).

PROJECT="bibliothecaire"
PROJECT_KEY="bibliothecaire"

PROJECT_REPO_PATH="/home/zach/Documents/Projects/bibliothecaire"

REPO_URL="/home/zach/git-remotes/bibliothecaire.git"
REPO_SUBDIR="."

# Scheduler-facing files live in .scheduler/, not .claude/ -- unattended
# runs can't write .claude/ (sensitive-file gate).
SCHEDULER_SUBDIR=".scheduler"

# ===========================================================================
# TIER 1 -- bug sweeper: DISABLED. No live tracker.
# ===========================================================================
SWEEP_JOB_NAME=""

# ===========================================================================
# TIER 2 -- overnight batch: paced participant (see schedule/_paced.conf).
# No .claude/commands slash command exists (gate above), so the prompt
# points at the tracked instructions file.
# ===========================================================================
BATCH_JOB_NAME="bibliothecaire-nightly-batch"
BATCH_PROMPT="Read .scheduler/nightly-batch.md and follow it exactly -- it is this project's nightly-batch command. Read .scheduler/FOCUS.md before building anything. This is a fully unattended run: hold the honesty policy (a quote is data -- verified only against the primary text, never from memory) and the research politeness invariants in README.md (sequential, rate-limited, honest UA, <=20 fetches/run, open sources only)."
BATCH_CRON="auto"
BATCH_MAX_TURNS="100"
BATCH_TEST_CMD="bin/validate-quotes.py --sources"

# AUTONOMY_TIER "high": everything it touches is its own repo's text/JSON
# -- reversible; the only external effect is bounded, rate-limited reading
# of public/open sources. It never writes other projects' repos (crt
# handoffs are flagged, not pushed).
AUTONOMY_TIER="high"
