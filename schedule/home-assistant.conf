# home_assistant project's schedule entry. Tier 2 (nightly-batch) only --
# no Tier 1 bug-sweeper for this project (it doesn't have a fast-moving
# codebase with mechanical bugs the way chezz/vkv-inventory do; it's a
# home-automation config/docs repo backed by a live physical instance).
#
# JOB_NAME/PROJECT_KEY match ~/.local/bin/home-assistant-nightly-batch-loop.sh
# exactly (confirmed 2026-07-17).
#
# BATCH_CRON="auto" -- bin/sync-crontab.sh assigns a batch slot (see
# schedule/_batch.conf) instead of a hand-picked time.

PROJECT="home-assistant"
# Real working copy (used to symlink .claude/QUESTIONS.md into
# ../questions/<PROJECT>.md, and where the wrapper's own
# .session-handoff/ secrets copy-in reads from).
PROJECT_REPO_PATH="/home/zach/Documents/Project Archive/home_assistant"

# Runtime config for bin/scheduler-run, migrated from
# ~/.local/bin/home-assistant-nightly-batch-loop.sh (MIGRATION.md step 1,
# 2026-07-24). BATCH_SCRIPT below is still set, so it stays authoritative
# for now (see sync-crontab.sh precedence) -- these fields are inert until
# a human drops BATCH_SCRIPT and re-runs sync-crontab.sh --apply to flip
# the switch. SECRETS_SRC_DIR/SECRETS_DEST_SUBDIR reproduce the wrapper's
# pre-clone .session-handoff/ copy-in (secrets that can't survive a fresh
# `git clone` the way the rest of the repo does) -- lib/sweep-loop-common.sh
# already supports this generically (see DESIGN-NOTES.md "Secrets that
# can't survive a clone"), so no wrapper-specific logic is lost by dropping
# the wrapper; SECRETS_DEST_SUBDIR is left unset since the wrapper used the
# engine's own default (".session-handoff").
REPO_URL="https://github.com/hf7y/baudin.git"
REPO_SUBDIR="."
SECRETS_SRC_DIR="/home/zach/Documents/Project Archive/home_assistant/.session-handoff"
BATCH_MAX_TURNS="200"
BATCH_EXPIRY_DAYS="7"
# Default (Bash,Read,Write,Edit,Glob,Grep) can't do a true external-network
# test -- curl from this machine hits the same LAN the Pi is on, which can
# false-negative on NAT-loopback-unsupported routers. WebFetch runs from
# outside this network, so it's the only way to genuinely confirm the
# port-forward/ISP-block question rather than guessing from local checks.
BATCH_ALLOWED_TOOLS="Bash,Read,Write,Edit,Glob,Grep,WebFetch"
BATCH_PROMPT="/nightly-batch

This is a fully unattended overnight run with no human review step. Read .claude/FOCUS.md FIRST -- everything you do tonight is scoped by that file. This project manages a REAL, LIVE Home Assistant instance controlling physical devices, not just a codebase -- be correspondingly careful about physical side effects at night (see .claude/commands/nightly-batch.md for specifics). An accumulated feature idea that is not in service of the current focus should be written up as deferred in tonight's report, not implemented, no matter how easy it looks.

Write your report to ~/reports/home-assistant/\$(date +%Y-%m-%d).md and update ~/reports/home-assistant/LATEST.md to match it, so it is a 30-second read the next time this machine boots up, covering: what got fixed/verified, what's still broken, what was deliberately deferred and why, and any open questions that need a human decision. Confirm everything is committed and pushed to origin/master before finishing -- an overnight run that isn't saved anywhere didn't happen. Also update README.md itself if the project's actual state changed -- it's the persistent memory future runs trust, not just tonight's report."

BATCH_JOB_NAME="home-assistant-nightly-batch"
BATCH_SCRIPT="/home/zach/.local/bin/home-assistant-nightly-batch-loop.sh"
BATCH_CRON="auto"

# AUTONOMY_TIER (declared 2026-07-24, paced cycle -- axis 1.5, formalizing
# EXISTING policy, no behavior change): "low" -- matches the
# already-decided FOCUS.md "Target UX" mockup (2026-07-20); a
# home-automation repo backed by a live physical instance is exactly the
# vision doc's "never share one policy [with a hobby project]" example.
AUTONOMY_TIER="low"
