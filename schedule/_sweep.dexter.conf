# Sweep tick meta -- HOST-SCOPED to `dexter`. OPTS OUT.
#
# Blanking SWEEP_TICK_CRON suppresses the tick schedule/_sweep.conf would
# otherwise install here. Sourced after the shared file, so this wins.
#
# THAT WAS TRUE OF THE FILES AND FALSE OF THE CODE until 2026-07-29. The
# opt-out was documented in bin/sync-crontab.sh and never implemented: the
# shared file sets SWEEP_TICK_JOB and SWEEP_TICK_CMD, this one blanks only
# the CRON, and the emit block's "all three or none" guard read that as an
# unfinished conf -- `ERROR [sweep]: ... sweep tick omitted`, and `exit 1`
# for the whole run. dexter got the right crontab and a failure exit code,
# on the very command .scheduler/FOCUS.md's bar opens with. Now the shared
# value is captured before this file is sourced, so armed-then-blanked is
# recognised as an opt-out and announced as a `note [sweep]`.
# Witness: tests/runner-conf-host-witness.sh cases 8-9.
#
# WHY: dexter has never run `scheduler sweep`, and its hand-written crontab
# (2026-07-24 through run 3) had no sweep line -- verified against
# realisateur/archive/crontab-backups/dexter-crontab-2026-07-29T1425.bak, which
# holds exactly one job, the paced runner tick.
#
# So this file changes NOTHING about how dexter behaves. It exists because
# `sync-crontab.sh` previously read _sweep.conf shared-only, which meant the
# first `--apply` on this host would have ARMED a */15 sweep tick that no human
# ever chose here -- a new recurring job appearing as a side effect of
# regenerating the crontab from config.
#
# `scheduler sweep` is pure git/bash with zero API cost, so this is not a quota
# decision. It is that sweep auto-commits `*.md` drift and re-verifies MIGRATED
# markers across every registered project, and dexter's checkout does not hold
# most of those projects -- a sweep here would be reporting on repos it cannot
# see. mandark is where the ecosystem-wide sweep belongs.
#
# TO ENABLE IT HERE LATER: delete this file (the shared _sweep.conf value then
# applies) or set SWEEP_TICK_CRON to a real expression. Do that only alongside
# a reason dexter should be sweeping projects it does not have checked out.
SWEEP_TICK_CRON=""
