# ecosim -- the ecosystem's own null-discriminator: one thesis (Ashby's
# Law binds at the SENSOR, not only the effector), the pure-stdlib
# simulator that tests it, and the artifact it produced
# (bin/silence-audit.sh). Registered 2026-07-28.
#
# PROVENANCE: refactored out of two realisateur worktree branches from an
# overnight Zach-directed session -- research/ecosystem-cybernetics and
# staging/silence-audit -- which remain on realisateur's bare remote as
# the full record. This is the first project here that was not scaffolded
# from an inbox note; it was promoted from a research branch.
#
# ============================ READ THIS ============================
# This project's tools READ the whole ecosystem and, at --commit, would
# WRITE outside their own repo:
#
#   bin/install-silence-audit.sh --commit  edits EVERY registered
#       project's CLAUDE.md (retires three build-discipline rows,
#       installs one pointer row).
#   bin/decide.sh <id> --commit            takes remediation options,
#       one of which (cron-logging) is machine-wide rsyslog config.
#
# BOTH ARE DRY-RUN BY DEFAULT, and the project's own .scheduler/FOCUS.md
# fences --commit as never-unattended, not as a flag-and-proceed item.
# That fence is the reason this registers at AUTONOMY_TIER="medium"
# rather than following the usual local-bare-remote "high" default: the
# blast radius of one mistaken --commit here is every other project's
# CLAUDE.md, which no other registered project can say.
#
# Nightly work is expected to be fixtures, reproducibility and the
# wiring-decision memo -- NOT wiring. Wiring is Zach's call and sits
# past the current stability milestone on purpose.
# ===================================================================
#
# Follows the crt/realisateur/sequestria precedent: git repo pushed to a
# LOCAL bare remote (no credentials/network needed), generic
# bin/scheduler-run entrypoint, joins the usage-paced governor (see
# schedule/_paced.conf) instead of a fixed cron time.

PROJECT="ecosim"
PROJECT_KEY="ecosim"

PROJECT_REPO_PATH="$HOME/Documents/Projects/ecosim"

# REPO_URL repointed 2026-07-29 (realisateur /ideate, Zach-directed). The
# local bare at /home/zach/git-remotes/ecosim.git was FIVE COMMITS STALE
# (2129a13 vs GitHub db3f660) -- an ancestor, not diverged, but it did not
# contain ecosim's own BRIEF-dexter-migration.md. Dispatch was cloning a ref
# without the work. Verified 2026-07-29 via `git ls-remote` against
# git@github.com:hf7y/ecosim.git from BOTH mandark and dexter (identical
# db3f660) and `git merge-base --is-ancestor`.
REPO_URL="git@github.com:hf7y/ecosim.git"

# ANSWER_CHANNEL: ecosim is the SECOND project on the GitHub-issues channel
# (chezz was the pilot). Zach-directed 2026-07-29: ecosim runs the dexter
# migration experiment and its own CLAUDE.md forbids writing findings into
# other projects' repos, so issues on ITS OWN repo are its instrument log --
# one issue per migration unit. hf7y/ecosim is PRIVATE, so unlike chezz there
# is no world-readable-questions concern.
#
# NOTE ON LABEL SAFETY, load-bearing: `scheduler -q` renders only issues
# carrying the `question` label. ecosim's instrument issues use `observation`
# and are therefore INVISIBLE to the human question surface by construction,
# not by convention. Do not add `question` to an instrument issue unless it is
# genuinely a decision for Zach.
ANSWER_CHANNEL="issues"
REPO_SUBDIR="."

SCHEDULER_SUBDIR=".scheduler"

# ===========================================================================
# TIER 1 -- bug sweeper: DISABLED. ecosim has no live web tracker.
# ===========================================================================
SWEEP_JOB_NAME=""

# ===========================================================================
# TIER 2 -- overnight batch: paced participant (see schedule/_paced.conf).
# ===========================================================================
BATCH_JOB_NAME="ecosim-nightly-batch"
# THE RUNNER EXPECTS A VERDICT AND NOTHING WAS ASKING FOR ONE.
#
# bin/usage-paced-runner.sh classifies every finished run through
# bin/verdict.sh: a run that records nothing is NOT-DONE, so it is
# re-dispatched with metabolism untouched. That default is deliberate and
# right -- the alternative is an ecosystem that shuts itself down because a
# machine rebooted mid-run.
#
# But ecosim's first real dispatch from `monkey` (2026-08-03) did 835s of
# genuine work, pushed two commits, and recorded nothing:
#
#   DONE ecosim rc=0 outcome=NOT-DONE (835s)
#   NO-VERDICT ecosim -- ran with no verdict written (its brief asks for one)
#
# The log says "its brief asks for one". It did not. BATCH_PROMPT was the
# bare string "/nightly-batch", and ecosim's own .claude/commands/nightly-batch.md
# is an unadapted copy of realisateur's template -- which the dispatched agent
# noticed and said so in its report. So a successful run was indistinguishable
# from a crashed one, and the runner will keep re-dispatching it forever.
#
# Asked HERE rather than in the repo's command file on purpose: this is the
# scheduler's contract with its participants, it applies to every participant,
# and it is deployable to any host by pulling one repo. A per-repo command
# file is the thing that was already wrong.
#
# $HOME expands because schedule/*.conf is SOURCED (unlike _paced*.conf, which
# is read -- MONKEY.md section 4), so this resolves per-user on every host.
BATCH_PROMPT="/nightly-batch

When you have finished -- and BEFORE you stop -- record a verdict, so the
scheduler can tell a finished run from a truncated one:

  $HOME/Documents/Projects/scheduler/bin/verdict.sh set ecosim <VERDICT> \"<one line why>\"

  CONTINUE   there is more to do on this brief; re-dispatch me next tick
  DONE       the bar in my brief is met; stop dispatching
  IMPOSSIBLE I cannot do this and further tries will not help

Recording nothing is treated as NOT-DONE and re-dispatched, which is the safe
default but makes a good run look identical to a crash. IMPOSSIBLE reduces
this project's metabolism, so use it only for a real dead end, not for a
run that merely ran out of turns -- that is CONTINUE."
BATCH_CRON="auto"
BATCH_MAX_TURNS="120"

# AUTONOMY_TIER (declared 2026-07-28 at registration): "medium" -- see the
# READ THIS block above. Reversible, in-repo work (fixtures, reproducing
# the simulator's verdict table, the WIRING-DECISION.md memo) is fully
# autonomous; anything that installs, symlinks, crontabs, or runs a
# --commit path is not, regardless of how well-tested it is.
AUTONOMY_TIER="medium"
