# vim-arcade -- platformer-style vim-motion teaching game, scaffolded by
# realisateur from a dropped inbox note. Registered 2026-07-20.
#
# Follows the crt/realisateur/groc-mangr precedent: git repo pushed to a
# LOCAL bare remote (no credentials/network needed), generic
# bin/scheduler-run entrypoint, joins the usage-paced governor as a Tier 2
# participant (see schedule/_paced.conf) instead of a fixed cron time.
#
# Scope is unattended-safe because .claude/commands/nightly-batch.md only
# builds against FOCUS.md's stated priorities (new vim-motion levels/
# mechanics, all unit-tested and curses-free) -- the one genuinely open
# design fork (tmux interactions) is explicitly flagged as a
# QUESTIONS.md-worthy proposal rather than something to guess deep on.
#
# ANSWER_CHANNEL="issues" (2026-08-04, vim-arcade@monkey self-dev
# arming): joins the chezz/ecosim/bibliothecaire GitHub-issues channel
# instead of the file-based `.claude/QUESTIONS.md` convention -- same
# mechanism, not a new one (`bin/scheduler`'s `answer_channel`/`cmd_ask`/
# `cmd_questions_issues`). vim-arcade's own account on monkey has a
# read-write deploy key for hf7y/vim-arcade (realisateur/MONKEY.md 8.3),
# so `gh` calls against its own repo need no separate credential.
# `question`/`answered` labels are created on first use via
# `ensure_gh_labels` -- no manual step. See `.claude/commands/
# nightly-batch.md`, updated alongside this to read/write issues instead
# of the file.
ANSWER_CHANNEL="issues"

PROJECT="vim-arcade"
PROJECT_KEY="vim-arcade"
# --- which account and host own this job's STATE (2026-08-05) ---------------
# CRON_ACCOUNT is what `scheduler`'s state_account()/state_home()/state_run()
# read to answer "whose ~/.local/share holds this job's run log". Until today
# NO conf in this repo set it, so state_account() always returned empty,
# state_home() always fell back to $HOME, and the whole per-account
# abstraction -- including its BLIND state -- had never once been exercised.
# That is why the glance reported these four as 7-12d idle and dead-man
# expired while they ran daily on monkey (hf7y/scheduler#33).
#
# CRON_HOST is set ALONGSIDE it, and is load-bearing rather than decorative.
# sync-crontab.sh checks CRON_HOST FIRST and `continue`s cleanly; without it,
# the next guard would fire `ERROR: CRON_ACCOUNT=vim-arcade is not a user on mandark
# -- skipping this conf` on every sync from mandark, because vim-arcade is a real
# account only on monkey. Host first, account second, in that order.
CRON_HOST="monkey"
CRON_ACCOUNT="vim-arcade"


PROJECT_REPO_PATH="$HOME/Documents/Projects/vim-arcade"

REPO_URL="https://github.com/hf7y/vim-arcade.git"
REPO_SUBDIR="."

# ===========================================================================
# TIER 1 -- bug sweeper: DISABLED. vim-arcade has no live web tracker.
# ===========================================================================
SWEEP_JOB_NAME=""

# ===========================================================================
# TIER 2 -- overnight batch: paced participant (see schedule/_paced.conf).
# ===========================================================================
BATCH_JOB_NAME="vim-arcade-nightly-batch"
BATCH_PROMPT="You are vim-arcade. Your role in the backlog-as-sensor build is

DISPLAYING THE NUMBERS TO ZACH (Zach's mapping, 2026-08-06: bibliothecaire
files, ecosim monitors, scheduler runs the mechanism, vim-arcade displays).

1. Work the issue queue:
     gh issue list --repo hf7y/vim-arcade --state open

   Start with #75, which specifies the display: open-issue count per project,
   its FIRST DERIVATIVE (rising or falling matters more than the absolute
   number), and issue age. That display is what closes the loop for the whole
   build -- a number nobody sees cannot pace anything. The form is your call.

   #74 is the other priority: the deploy-key failure is to be fixed at the
   PROVISIONING MECHANISM, not on this instance. Zach was explicit. If you fix
   only your own key, the next account hits the same wall, and the issue should
   NOT be closed.

2. TRIAGE IS NOT FIFO. Zach, 2026-08-06: \"first in ideas may be obviated
   before they can be realized.\" Do NOT just take the oldest. Before picking,
   read the open titles and ask of each: does its premise still hold? An issue
   whose premise expired should be CLOSED, saying which decision or commit
   expired it -- that is real work, it is cheap, and it is the only thing that
   makes the count mean anything. Closing three dead issues beats half-building
   a fourth.

3. CLOSE WHAT YOU RESOLVE. Zach, standing instruction: \"agents should close
   issues that are clearly resolved. not leave them to zach. he won't and
   they'll clutter.\" If your work resolves an issue, close it with a comment
   saying what landed and where (commit sha, PR, or file). Do not leave it for
   him to confirm. If you are NOT sure, say so on the issue and leave it open
   -- that is a different, also-correct outcome.

   Note how Zach answers: he comments and then CLOSES. A closed issue with his
   comment on it is an ANSWER, not an abandonment. Read closed issues before
   concluding a question went unanswered.

4. ONE issue per run. A half-finished second one is worse than a queue that
   moves slowly. Work on a BRANCH and open a PR; never push main. Commit
   atomically -- never 'git add -A' -- and leave the tree clean: a dirty tree
   at exit is a failed run, not a handoff.

5. Re-probe before you believe. Any headline QUANTITY in an issue -- a count, a
   size, an 'N of M' -- was true when written and may not be now. Re-derive it
   with a command before acting on it, and if you write it down, stamp it
   '# verified <date> via <command>'. Several confident surveys in this estate
   have been loudly wrong in exactly this way.

   When you display a number, say what it does NOT cover. The scheduler's
   dispatch counts read as authoritative while being crontab-only, and that
   blind spot hid a 10x over-dispatch for a full day.

6. Before stopping, record a verdict so the scheduler can tell a finished run
   from a truncated one:
     \$HOME/Documents/Projects/scheduler/bin/verdict.sh set vim-arcade <VERDICT> \"<one line why>\"

   CONTINUE   there is ACTIONABLE work left -- an open issue you could pick up
              on the next run without anyone else doing anything first.
   DONE       nothing actionable right now. THIS INCLUDES a queue whose only
              open issues are BLOCKED WAITING ON A HUMAN. You asked; the answer
              arrives when it arrives. Recording CONTINUE there gets you
              re-dispatched every tick to re-read an issue nobody has touched,
              which spends real quota to learn nothing.
   IMPOSSIBLE a real dead end, not merely out of turns -- that is CONTINUE.

Recording nothing is treated as NOT-DONE and re-dispatched, which is the safe
default but makes a good run look identical to a crash.

If the queue has nothing actionable: do nothing, say so, record DONE. An empty
run that says so honestly is worth more than an invented one -- the open-issue
count is becoming this ecosystem's pacing signal, and a run that manufactures
work to look busy corrupts the very number it is meant to move.
"
BATCH_CRON="auto"
BATCH_MAX_TURNS="120"

# TEST_CMD (2026-07-25, autonomy-merge gate): existing pytest suite under
# tests/.
BATCH_TEST_CMD="pytest -q"

# AUTONOMY_TIER (declared 2026-07-24, paced cycle -- axis 1.5, formalizing
# EXISTING policy, no behavior change): "high" -- matches the
# already-decided FOCUS.md "Target UX" mockup (2026-07-20); realisateur-
# spawned project on a local bare remote (no GitHub credentials reachable),
# per the Vision section's "no special starting tier, trust the
# scaffolding process" rule.
AUTONOMY_TIER="high"

# Opt-in to the shared schedule/_standing-rules.md block, prepended to
# BATCH_PROMPT at dispatch by bin/scheduler-run. See that script's comment
# and bin/propage's header for why this is a file now, not retyped prose.
USES_STANDING_RULES=1
