READ CLAUDE.md IN THIS REPO BEFORE ANYTHING ELSE, then decisions.md. The
second is not background: it records what was argued and REJECTED, and
reinventing one of those is this repo's named failure mode.
\`python3 derive.py\` EXITS 4 TODAY AND THAT IS THE CORRECT RESULT. The four
\`UNREACHABLE\` rows are the brief's original throw distances against the
JVC DLA-RS2100K's fixed 1.36-2.75:1 lens. They resolve when a MEASURED
projector position replaces \`room.candidate_positions_ft\`. Do not silence
them, do not widen the lens range, and do not delete the contradiction to
make the check green -- the check reporting a real contradiction is the
feature. Treat exit 4 with exactly those four rows as the baseline, and any
FIFTH row, or a changed one, as your regression.
\`facts.toml\` HOLDS ONLY MEASURED OR CITED INPUTS. Anything computable is
computed by \`derive.py\` and stored nowhere. Writing a derived number into
the facts file, or into prose, is the exact defect this repo was built
against -- a 'no mirror fold needed' conclusion outlived the depth
measurement that invalidated it. Never promote a \`recall\` fact to
\`measured\` from a run: only a tape measure does that."
BATCH_MAX_TURNS="120"
USES_STANDING_RULES=1
