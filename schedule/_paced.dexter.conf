#        cat ~/.ssh/dexter_wtul_deploy.pub        (on dexter)
#      or the single-line copy in .scheduler/QUESTIONS.md's 2026-07-25 entry.
#      (Private half stays in ~/.ssh on dexter, mode 600, never tracked here.)
#
#   2. [DONE 2026-07-25] `Host github-wtul-deploy` block added to dexter's
#      ~/.ssh/config (HostName github.com, User git, IdentityFile
#      ~/.ssh/dexter_wtul_deploy, IdentitiesOnly yes). Verified wired, not
#      assumed -- the failure mode moved from DNS to auth, which is exactly
#      what "dexter's half is done, GitHub's half isn't" looks like:
#        before: ssh: Could not resolve hostname github-wtul-deploy
#        after:  git@github.com: Permission denied (publickey)
#
#   3. [BLOCKED -- HUMAN, needs repo admin] Add the step-1 public key as a
#      Deploy Key on the hf7y/wtul GitHub repo with WRITE access (wtul's
