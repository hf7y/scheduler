# wtul -- NAMED EXCEPTION, added 2026-07-25 (see policy note above). Pure
# GitHub remote (REPO_URL="git@github-wtul-deploy:hf7y/wtul.git" in
# schedule/wtul.conf), no LAN/local-bare-repo dependency, no live physical
# device it acts on unattended (AUTONOMY_TIER="low", and its own batch
# prompt already refuses to touch the real optical drive unattended) -- the
# lowest-risk possible pick for a first non-hardware dexter test. Same weight
# (2) as its mandark line, same reasoning (in-progress momentum, 46
# commits/7d per the 2026-07-24 weight-audit pass). Uses the generic
# `bin/scheduler-run` entrypoint like crt above, NOT mandark's
# `~/.local/bin/wtul-batch-loop.sh` wrapper -- that wrapper is a host-local
# script installed by `sync-crontab.sh --apply` (mandark-only, not
# host-scoped, see the crt block's own note on this), and `scheduler-run`
# doesn't consult wtul.conf's BATCH_SCRIPT field at all, so bypassing the
# wrapper is safe, not a behavior change.
#
# `schedule/_paced.conf`'s wtul line was dropped in the SAME change as this
# one (see that file) so nothing double-dispatches -- same crt precedent.
#
# PARKED enabled=0 2026-07-25, same day it landed -- CREDENTIAL GAP, verified
# by running it on dexter, not assumed:
#   $ git ls-remote git@github-wtul-deploy:hf7y/wtul.git
#   ssh: Could not resolve hostname github-wtul-deploy: Temporary failure in
#        name resolution
#   fatal: Could not read from remote repository.
# The failure is name resolution, not auth: dexter's ~/.ssh/config has no
# `Host github-wtul-deploy` block at all (it has only github-scheduler-deploy
# and mandark-lan), and no wtul key exists here. Unlike crt -- which got a
# dedicated `dexter_mandark_deploy` key provisioned 2026-07-24 BEFORE its
# enabled=1 flip -- wtul's move here landed ahead of its credential, so the
# preconditions the crt block above established as the pattern ("live-verified
# from dexter itself" before flipping) were never met for wtul.
#
# Landing it enabled here while `_paced.conf` has it dropped means wtul runs
# NOWHERE and burns a gate probe + a failing clone every rotation slot -- the
# exact hazard `_paced.conf`'s own "DO NOT LAND THIS ALONE" note (crt block)
# warns about. So: parked here, restored to enabled=1 in `_paced.conf` in the
# SAME change, per the revert instructions both files already carry. wtul
# keeps running on mandark, unaffected.
#
# TO UN-PARK (the named-exception test is still wanted, only blocked).
# Steps 1 and 2 are DONE on dexter as of 2026-07-25; only step 3 (human,
# GitHub-side) gates the rest.
#
#   1. [DONE 2026-07-25] Dedicated keypair generated ON DEXTER, no passphrase,
#      scoped to wtul only, same shape/naming as the crt key:
#        ssh-keygen -t ed25519 -f ~/.ssh/dexter_wtul_deploy -N '' \
#                   -C 'dexter-wtul-deploy'
#      Fingerprint: SHA256:PF2dUFFdzCvD4lZ/Mhcd2Kkf9m103pt0kWxb9ov/QLA
#      The public half is deliberately NOT reproduced here line-wrapped --
#      a key transcribed off a wrapped comment is a key that silently
