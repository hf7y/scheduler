# Participants for usage-paced-runner.sh -- HOST-SCOPED to `dexter`.
#
# Same format as schedule/_paced.conf (name|enabled|command, or
# name|enabled|weight|command). See that file's header for the field
# semantics; they are not repeated here.
#
# WHY THIS FILE EXISTS (2026-07-24, dexter bring-up -- see DESIGN-NOTES.md
# "dexter registers itself as a second host"):
# dexter and mandark are two INDEPENDENT schedulers sharing one git-tracked
# repo (decided 2026-07-24: full local peer, no shared lock, no cross-host
# rotation). They therefore need different rotations. Rather than add a HOST
# column to the single shared _paced.conf -- one file two machines would edit,
# which the AUTOMATED weight-audit.sh writer makes an active conflict, not a
# theoretical one -- each host may own its own file:
#
#   schedule/_paced.<short-hostname>.conf   picked up automatically by that host
#   schedule/_paced.conf                    used by any host without its own file
#
# mandark has no _paced.mandark.conf, so it keeps reading _paced.conf exactly
# as it did before -- this file changed nothing there. Resolution order and
# the reasoning live in bin/usage-paced-runner.sh's "which participants file"
# block. List registered hosts with: ls schedule/_paced.*.conf
#
# dexter writes ONLY this file. mandark writes ONLY _paced.conf. That is the
# whole concurrency story -- different paths, so the two hosts cannot produce
# conflicting edits to the same lines.
#
# ---------------------------------------------------------------------------
# PINNING POLICY: only hardware/network-evidenced projects belong here.
# Everything else stays on mandark. Do NOT move a project here just to
# balance load -- "pin by need" means "don't move what doesn't need moving"
# (DESIGN-NOTES.md 2026-07-24, decision 2). `crt` is the ONE confirmed case.
# ---------------------------------------------------------------------------
#
# `scheduler` is deliberately NOT here. dexter could technically self-develop
# too, but two hosts independently committing to one scheduler git history --
# each auto-merging to its own local main -- is a stronger version of the
# divergence that bit this repo earlier the same day (two worktrees on ONE
# host). That one was cleared by a fast-forward, which only works while one
# side hasn't independently advanced -- exactly what two pushing hosts remove.
# Open human question in .scheduler/QUESTIONS.md; self-dev stays single-host
# until it is answered.
#
# ---------------------------------------------------------------------------
# crt -- PINNED here (hardware-evidenced), but enabled=0: NOT YET RUNNABLE.
#
# The pin is correct and re-verified: crt's OctoPrint at 192.168.0.43 answers
# from THIS WSL2 environment (checked 2026-07-24 from dexter: ICMP 0% loss,
# TCP 80 open, and an OctoPrint-identifying HTTP 302 to /login/ carrying the
# x-clacks-overhead header -- not merely a port that happened to be open).
# That retires the caveat that the 2026-07-20 confirmation was against the
# old full VM's networking and might not survive WSL2's NAT. It does.
#
# What is NOT satisfied is repo access. schedule/crt.conf sets
#   REPO_URL="/home/zach/git-remotes/crt.git"
# a bare repo on MANDARK's filesystem, deliberately local so crt's VM
# password never leaves that machine. dexter cannot reach that path, and
# crt had no remote mirror (crt.conf noted a deploy key existed "if a
# private GitHub mirror is wanted later" -- never set up). Verified by
# running it, not assumed:
#   $ bin/scheduler-run crt batch
#   fatal: repository '/home/zach/git-remotes/crt.git' does not exist
#
# UPDATED 2026-07-24, mandark side (human + interactive session on mandark):
# crt.conf's REPO_URL now points at
# ssh://mandark-lan/home/zach/git-remotes/crt.git -- SSH access provisioned
# on mandark (openssh-server installed+enabled, a dedicated
# `dexter_mandark_deploy` key restricted to git-shell only in mandark's
# authorized_keys, no shell/port-forwarding). This keeps the VM password on
# the LAN, same reasoning as the original local-path choice; "dexter becomes
# authoritative for crt instead of mandark" is the eventual direction but
# deliberately parked (see QUESTIONS.md) -- this is the smaller, reversible
# step. Full writeup: DESIGN-NOTES.md 2026-07-24.
#
# NOT YET LIVE-VERIFIED FROM DEXTER. Still needed before flipping enabled
# below, same "verified by running it" standard as the failure above:
#   1. dexter's ~/.ssh/config needs the `mandark-lan` Host alias (HostName
#      192.168.0.27, User zach, IdentityFile ~/.ssh/dexter_mandark_deploy) --
#      confirm this actually got added, don't assume.
#   2. `ssh -T git@mandark-lan` from dexter -- git-shell has no interactive
#      shell, so the EXPECTED result is it drops the connection immediately
#      (that's success, not a failure) rather than a banner.
#   3. `git ls-remote ssh://mandark-lan/home/zach/git-remotes/crt.git` --
#      this is the real test; it should list crt's refs.
#   4. Only once 1-3 pass: flip 0 -> 1 below.
#
# The command below is the GENERIC entrypoint, not mandark's
# ~/.local/bin/crt-nightly-batch-loop.sh wrapper: crt.conf sets BATCH_PROMPT
# and no BATCH_SCRIPT, so bin/scheduler-run is the correct caller and no
# per-host wrapper needs to exist here at all.
#
# schedule/_paced.conf's crt line is ALREADY dropped (merged 2026-07-24,
# same change as this comment) -- so crt currently runs NOWHERE until 1-4
# above are done and this flips to 1. That is a real, accepted gap, not an
# oversight: landing the mandark-side drop separately (rather than bundled
# with an unverified enable) means crt's absence is visible and traceable
# to "waiting on live dexter verification," not silently coupled to a flip
# nobody could test yet.
crt|0|3|/home/zach/scheduler/bin/scheduler-run crt batch

# NOTE: with crt disabled this rotation is EMPTY, and that is the correct
# state right now -- dexter's tick runs, probes nothing, and logs
# "no enabled participants in .../_paced.dexter.conf" every time the
# rotation signature changes. That line is deliberate: an idle-because-
# blocked host and a misconfigured host must not look the same in run.log.
