# Meta config for the usage-paced dispatcher (read by bin/sync-crontab.sh).
#
# The mere PRESENCE of this file switches Tier 2 (nightly batch/dev) away from
# fixed clock times to USAGE-PACED dispatch: sync-crontab emits ONE tick line
# for the runner and SUPPRESSES the fixed BATCH cron of every project listed
# (enabled) in schedule/_paced.conf. The runner then round-robins those
# participants, running one cycle whenever usage-gate.sh reports spare weekly
# quota. Tier 1 (bug-sweeps) are never affected.
#
# ROLLBACK to fixed nightly times: delete this file and re-run
#   bin/sync-crontab.sh --apply
# The projects' BATCH_* config was never touched, so their old lines come back.
#
# RUNNER_ENV is for the DISPATCHER's own knobs only (PACED_MAX_PER_TICK, ...).
# It is interpolated verbatim onto the generated crontab line, so anything set
# here needs `bin/sync-crontab.sh --apply` to take effect and then lives on a
# crontab line rather than in a conf.
# The usage-gate PACING knobs (USAGE_CEILING, USAGE_MIN_SLACK,
# USAGE_RUSH_BEFORE_RESET_MIN, USAGE_PROBE_MODEL) belong in
# schedule/_usage.conf (or _usage.<host>.conf) as of 2026-07-26 -- read
# directly by bin/usage-gate.sh, picked up on the next tick, no --apply.
# Do NOT set them here as well: env wins over the conf, so a stale value on
# the crontab line would silently outrank the file someone just edited.
RUNNER_JOB="scheduler-paced-runner"
RUNNER_CMD="/home/zach/.local/bin/usage-paced-runner.sh"
# 2026-08-01, Zach-directed (THE FLOOR): metabolism slowed from */5 to every
# six hours -- 288 ticks/day to 4. Dispatch is being restarted after the
# 2026-07-29 crontab emptying, and it restarts deliberately slow with one
# participant, not at the rate that produced the state being recovered from.
RUNNER_CRON="0 */6 * * *"
# PACED_MAX_PER_TICK 16 -> 1, same date and same reason: one dispatch per tick
# is the ceiling that makes "one loop, watched" true by construction rather
# than by there happening to be only one enabled participant today. Raising it
# should be a decision taken when a second project is unparked, not a leftover.
#
# USAGE_CEILING moved OUT of here to schedule/_usage.conf. This file's own
# comment above and bin/usage-gate.sh's "RETIRES:" note both say that a usage
# knob set here lands at precedence 1 (plain env on the crontab line) and
# silently outranks the conf someone just edited. It was set in both places.
# Value carried across unchanged (0.99) -- this is a relocation, not a retune.
RUNNER_ENV="PACED_MAX_PER_TICK=1"
PACED_SUPPRESS_BATCH=1
