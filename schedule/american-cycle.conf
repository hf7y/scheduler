PROJECT_REPO_PATH="$HOME/Documents/Projects/american-cycle"
REPO_URL="https://github.com/hf7y/american-cycle.git"
REPO_SUBDIR="."
ANSWER_CHANNEL="issues"
SWEEP_JOB_NAME=""
BATCH_JOB_NAME="american-cycle-nightly-batch"
BATCH_PROMPT="@@FRAGMENT:run-procedure@@

READ CLAUDE.md IN THIS REPO BEFORE ANYTHING ELSE, then DECISIONS.md. The
second is not background: its \`considered and cut\` table lists ideas that
are attractive, were argued, and were REMOVED. Reinventing one is the failure
mode this repo has already had. A \`§N\` in a code comment cites a document
that no longer exists -- never follow it, and never write a new one.

The board a player loads is the COMMITTED bundle \`ui/index.html\`, not the
source. Any change under \`sim/\` or \`engine/\` that the board reads must be
followed by \`node ui/build.ts\`, and \`git diff --exit-code ui/index.html\`
must come back clean before you open a pull request. A stale committed bundle
is the board and the simulator playing different games, and it has shipped.

This repo has no \`rm\`: \`.claude/hooks/guard-destructive.py\` blocks the
destructive shell verbs and \`.claude/bin/trash <paths>\` displaces instead.
\`reports/\` is gitignored, so an artefact removed there cannot be restored
from git.

When you have finished -- and BEFORE you stop -- record a verdict, so the
scheduler can tell a finished run from a truncated one:
  \$HOME/Documents/Projects/scheduler/bin/verdict.sh set american-cycle <VERDICT> \"<one line why>\"
  CONTINUE   there is ACTIONABLE work left.
  DONE       the bar in the brief is met, or nothing is actionable right now.
  IMPOSSIBLE a real dead end, and further tries will not help.
Recording nothing is treated as NOT-DONE and re-dispatched."
BATCH_CRON="auto"
BATCH_MAX_TURNS="120"
USES_STANDING_RULES=1
