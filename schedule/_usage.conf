# Pacing knobs for bin/usage-gate.sh -- the ONE persistent place to set them.
#
# The gate is what decides whether background jobs may run right now (see that
# script's header for the even-burn model). Until 2026-07-26 its ceiling lived
# only in the script (`CEILING="${USAGE_CEILING:-0.85}"`), so the only durable
# way to change it was editing RUNNER_ENV in schedule/_runner.conf and running
# `bin/sync-crontab.sh --apply` -- two steps, and the value ended up retyped
# onto a generated crontab line instead of read from a conf.
#
# Now: set a knob here, and the next 5-minute tick picks it up. No --apply, no
# crontab edit, nothing to redeploy. This file is read directly by the gate
# (parsed, not sourced -- scalar knobs only, no shell logic).
#
# Precedence, per FIELD (so overriding one knob doesn't reset the others):
#   1. explicit env       USAGE_CEILING=0.9 bin/usage-gate.sh   (always wins;
#                         this is how you test a value without committing it)
#   2. _usage.<host>.conf per-host override, e.g. _usage.dexter.conf. Same
#                         convention as schedule/_paced.<host>.conf. mandark
#                         and dexter share ONE account budget, so leaving more
#                         headroom on one host is a real want -- DESIGN-NOTES.md
#                         "multi-machine parallelism".
#   3. this file          the shared base, used by every host without its own.
#   4. the gate's built-in defaults -- the values documented below. Left
#                         commented out on purpose: the script stays the single
#                         definition of each default (a repo-less copy install
#                         has to fall back to them anyway), and this file is
#                         purely the override layer. Uncomment to override.
#
# Verify what actually took effect: the gate's own verdict line reports the
# resolved value AND where it came from, e.g.
#   verdict=RUN ... ceiling=0.9 ... knobs=ceiling:_usage.conf,min_slack:default,...
# `bin/scheduler pacing` prints that line verbatim.
#
# A value that isn't a number in range is a hard ERROR (exit 2), which every
# caller treats as HOLD -- a typo here stops paced dispatch loudly and says
# which file and value it choked on, rather than quietly pacing against 0.

# Never dispatch while any window is at/above this utilisation (0-1).
# Default: 0.85
#USAGE_CEILING=0.85

# Require at least this much room below the even-burn line to dispatch (0-1).
# Default: 0.02
#USAGE_MIN_SLACK=0.02

# Within this many minutes of the 7-day window's reset, drop the "on-pace"
# hold entirely -- unused weekly quota does not roll over (see the gate's
# "Rush-before-reset" header). Ceiling/rejected still block. Default: 120
#USAGE_RUSH_BEFORE_RESET_MIN=120

# Model used for the ~23-token probe that returns the rate-limit headers.
# Default: claude-haiku-4-5-20251001
#USAGE_PROBE_MODEL=claude-haiku-4-5-20251001
