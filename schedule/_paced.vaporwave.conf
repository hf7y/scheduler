# usage-paced-runner.sh participants, HOST-SCOPED to `vaporwave`. Format:
# schedule/_paced.conf. Without this file the runner falls back to mandark's
# rotation (0 enabled rows), so every tick here was inert and said nothing.
# vaporwave has its OWN Anthropic account (realisateur#695), so these rows do
# not compete with _paced.monkey.conf's. `1` is MEMBERSHIP; ROSTER's state
# column is the only surface that arms (#364), and all four are `parked`.
# Empty queues cost ~nothing: tempo.sh paces 0 actionable at 1440 min, and each
# conf's prompt records DONE rather than inventing work.
#
# COMMANDS RUN FROM THE INSTALLED BUILD, NOT A PER-ACCOUNT CHECKOUT
# (hf7y/realisateur#1138), same convention bin/dose-project.sh's
# DOSE_BUILD_ROOT and bin/usage-paced-runner.sh's host-mode roster_rows()
# already use: "${VERB_HOST_BUILD_ROOT:-/usr/local/share/verb-builds}/current
# /scheduler/bin/scheduler-run <project> batch". The installed build is
# always the current one; a per-account checkout could go stale until
# hand-pulled -- hf7y/scheduler#321 is what that looked like: wtul's dispatch
# checkout diverged and ran stale code for three ticks before a human reset
# it by hand. This column is read as a literal command (usage-paced-runner.sh
# execs it unexpanded), so the path below is the RESOLVED default, not the
# ${VERB_HOST_BUILD_ROOT:-...} shell expression -- a host that overrides
# VERB_HOST_BUILD_ROOT needs its own row here, same as it would for any other
# path-shaped default.
dog|1|/usr/local/share/verb-builds/current/scheduler/bin/scheduler-run dog batch
vibe-kiosk|1|/usr/local/share/verb-builds/current/scheduler/bin/scheduler-run vibe-kiosk batch
inv-redirects|1|/usr/local/share/verb-builds/current/scheduler/bin/scheduler-run inv-redirects batch
vkv23|1|/usr/local/share/verb-builds/current/scheduler/bin/scheduler-run vkv23 batch
# wavebucks and inventory-app rows are NOT added here -- hf7y/realisateur#1130
# /#1131 add them in a parallel PR; that PR should point their commands at
# this same installed-build root when it lands (possible trivial merge
# conflict on this file to reconcile, not a design disagreement).