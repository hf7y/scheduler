# _monitor.conf -- NON-AGENT recurring jobs, armed by `arme`, never by dose.
#
# Read by `arme` (scheduler's bashified branch). Every job here is maintenance
# that runs FREE: no model in the loop, no token cost, nothing to meter.
#
# WHY THESE ARE NOT IN _runner.conf OR A PROJECT CONF. Every job kind
# sync-crontab.sh emits -- RUNNER, SWEEP, BATCH -- is agent work or the
# dispatch of it, and all of them are gated by USAGE_CEILING. A monitor
# inheriting that gate goes quiet exactly when quota is exhausted, so
# "quota exhausted" and "nothing to report" arrive as the same silence.
# These jobs are ungated on purpose. `arme check` REFUSES to arm anything
# whose command names the model runner, so the boundary is enforced rather
# than trusted.
#
# format: name|enabled|cron|command
#   name     the job's identity in the crontab tag (arme:<name>:MONITOR)
#   enabled  1 armed, 0 parked -- parked entries stay declared and visible
#   cron     five fields
#   command  must be executable and must not reach a model
#   attest   REQUIRED when the static check cannot prove the command is a leaf.
#            A sentence saying why it cannot spend. The check refuses without
#            one, so the register holds a claim in git rather than a guess.
#            A command that NAMES the model runner is refused outright and
#            cannot be attested away.
#
# A schedule/_monitor.<host>.conf entry of the same name REPLACES the one
# here, on the shared-then-host rule _runner.conf and _sweep.conf already use.

# PARKED 2026-08-05, Zach-directed: "ecosim needs to just go. nothing on
# mandark really needs it. it's useless." The ecosim dev clone was removed from
# mandark the same evening, and this row's command reaches into it:
# ecosim-sensor-tick.sh resolves SENSOR as
# ${INSTALLE_PROJECTS:-$HOME/Documents/Projects}/ecosim/bin/ecosim-sensor.
# Left armed, it would log BLIND WRAPPER_NO_SENSOR every 30 minutes forever --
# loud, which is right, but loud about a thing nobody intends to fix.
#
# Parked, not deleted, because this row is the ONLY active line mandark's
# crontab had: parking it is what makes "scheduler triggers nothing on mandark"
# a mechanical fact rather than a claim. To revive it, set enabled back to 1
# AFTER something puts ecosim-sensor back on PATH -- realisateur#62 would have
# had the wrapper read the verb build instead of a clone.
ecosim-sensors|0|*/30 * * * *|/home/zach/.local/bin/ecosim-sensor-tick|ecosim-sensor is an offline sensor suite: SENSOR-CONTRACT.md v1 promises no remediation and no model in the loop, and `ecosim-sensor selftest` runs its whole alphabet free
# verb-build-check, added 2026-08-05 for SPRINT-MANDARK-OFF.
#
# WHY IT IS NEEDED. Once `installe` resolves verbs out of a pinned build
# (senechal#22) rather than out of dev clones, the build becomes the single
# thing 32 verbs on this host depend on -- and the sprint deletes 125M of
# clones on the strength of it. Nothing currently notices if that artifact
# goes stale or the meta-repo becomes unreachable. This is the notice.
#
# WHAT --check BUYS THAT A `git pull` WOULD NOT. It distinguishes BLIND
# (exit 3, could not reach hf7y/verbs) from up-to-date (exit 0). That
# distinction is the entire reason the exit code exists -- install-verb-build.sh's
# own header calls it "the `garde` shape", where skipping unreachable
# destinations made "nothing pending" indistinguishable from "everything is
# proven". A monitor that cannot tell those apart is worse than none.
#
# NON-AGENT, so it is never usage-gated: --check is a `git ls-remote` and a
# tag comparison. No model, no quota, nothing to pace.
#
# THE REPO PATH, NOT ~/.local/bin, and that is not an oversight. Unlike
# ecosim-sensor-tick above, `install-verb-build.sh` is NOT on PATH -- verified
# 2026-08-05, `ls ~/.local/bin/install-verb-build.sh` -> No such file. Pointing
# a cron line at a path that does not exist is precisely the failure
# silence-audit exists to catch, so this names where the script actually is.
# realisateur is explicitly STAYING on mandark (the shim layer is out of the
# sprint's scope, Zach: "last or never"), so this path is stable. If the script
# is ever shimmed onto PATH, move this row to match ecosim-sensors' shape.
#
# 6-HOURLY, matching the build's own cadence rather than beating it. The
# nightly build is cut at 01:30 UTC; checking more often than that would report
# the same answer repeatedly, and checking less often could let a full day pass
# on a stale build.
verb-build-check|1|0 */6 * * *|/home/zach/Documents/Projects/realisateur/bin/install-verb-build.sh --check|non-agent: `--check` is a git ls-remote against hf7y/verbs and a tag comparison. Exit 3 = BLIND (could not look), exit 1 = a newer build exists, exit 0 = current. Spends no quota, and the sprint deletes 125M of dev clones on the strength of the artifact it watches
