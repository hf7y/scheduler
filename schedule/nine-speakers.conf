# nine-speakers -- REGISTERED 2026-08-05, Zach-directed ("register the other five"),
# alongside arming chezz. Registered is not armed: there is NO row for this
# project in any schedule/_paced*.conf and no EXEMPT line in schedule/FREEZE,
# so nothing dispatches it. Registration makes it a known participant --
# which is what install-verbs.sh's "registered" column reads, and what makes
# its declared verb accountable to something.
#
# WHY IT WAS NOT ARMED. Three preconditions are unmet, and each would produce
# a specific failure rather than a slow start:
#   1. No .scheduler/ directory in the repo -- no FOCUS.md, no QUESTIONS.md.
#      BATCH_PROMPT below runs /nightly-batch, which builds against FOCUS.md's
#      stated priorities. With no FOCUS.md there is nothing to build against.
#   2. No unix account on monkey. An enabled row whose command path does not
#      exist makes every runner log "SKIP nine-speakers -- command not runnable" on
#      EVERY tick -- ~48 lines a night at the current 0,30 cadence, in the
#      same run.log someone is reading to see how the night went. Stand the
#      account up first with realisateur bin/setup-selfdev-project.sh.
#   3. Arming spends a shared weekly quota. That is a judgment, and every
#      guard in this ecosystem stops one step short of it.
#
# PROBED 2026-08-05 rather than assumed:
#   * hf7y/nine-speakers -- PRIVATE, default branch `main`, last pushed 2026-07-30.
#   * carries a `bashified` branch, and therefore declares a verb.
#
# BRANCH NAME IS LOAD-BEARING AND scheduler CANNOT PIN IT. There is no
# BATCH_BRANCH field anywhere in this repo -- `scheduler-run` resolves the
# repository's DEFAULT branch when nothing says otherwise. That is exactly
# realisateur#39: vim-arcade's default was `tmux-pane-mechanic`, a PR merged
# into it, and its content was absent from main while both sides reported
# success. Recorded here because this project's default is `main`, so anyone
# arming it must confirm that is still the branch the work is on.

PROJECT="nine-speakers"
PROJECT_KEY="nine-speakers"
PROJECT_REPO_PATH="$HOME/Documents/Projects/nine-speakers"
REPO_URL="https://github.com/hf7y/nine-speakers.git"
REPO_SUBDIR="."
SWEEP_JOB_NAME=""
# TIER 2 IS DELIBERATELY BLANK -- this is what "registered, not armed" MEANS
# mechanically. sync-crontab.sh enables the batch tier unless BATCH_JOB_NAME,
# BATCH_SCRIPT and BATCH_CRON are ALL empty (bin/sync-crontab.sh:678); with any
# one of them set and no paced row to suppress it, the project gets a FIXED
# nightly cron line. On 2026-08-05 that is exactly what happened: these five
# were written with BATCH_JOB_NAME + BATCH_CRON="auto" and five nightly lines
# were installed in chezz's crontab on monkey for projects with no clone and
# no FOCUS.md. Restore both values when the project is genuinely armed.
#   BATCH_JOB_NAME="nine-speakers-nightly-batch"
#   BATCH_CRON="auto"
BATCH_JOB_NAME=""
BATCH_PROMPT="/nightly-batch
When you have finished -- and BEFORE you stop -- record a verdict, so the
scheduler can tell a finished run from a truncated one:
  \$HOME/Documents/Projects/scheduler/bin/verdict.sh set nine-speakers <VERDICT> \"<one line why>\"
  CONTINUE   there is ACTIONABLE work left.
  DONE       the bar in the brief is met, or nothing is actionable right now.
  IMPOSSIBLE a real dead end, and further tries will not help.
Recording nothing is treated as NOT-DONE and re-dispatched."
BATCH_CRON=""
BATCH_MAX_TURNS="120"
AUTONOMY_TIER="medium"
