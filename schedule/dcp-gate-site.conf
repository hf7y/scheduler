# dcp-gate-site -- the DCP checker site. REGISTERED 2026-08-28, Zach-directed
# ("onboard dcp-gate-site"), closing hf7y/scheduler#228's fourth state: this
# project was ABSENT from _paced.monkey.conf and from schedule/ entirely, not
# merely parked, while holding 22 open issues nothing that walks the roster
# counted.
#
# THIS IS CLIENT WORK, and the repo already says what an agent may not do.
# hf7y/dcp-gate-site's own CLAUDE.md carries a "Work an agent must never do"
# section -- never post to a forum or mailing list, never send outreach email,
# never register an account as a person -- because posting as the founder is
# "the one unrecoverable mistake available here". USES_STANDING_RULES does not
# carry that; the brief below points at the file that does.
#
# DEFAULT BRANCH IS `master`, NOT `main`, and scheduler cannot pin it: there is
# no BATCH_BRANCH field, so scheduler-run resolves the repository's default.
# That is realisateur#39 (vim-arcade's default was a feature branch and its
# content was absent from main while both sides reported success). Recorded
# here because anyone reading this file will assume `main`.
#
# PROBED 2026-08-28 rather than assumed: PRIVATE, default `master`, 22 open
# issues of which 6 carry needs-human or product-decision, and 15 branches
# including seven stranded `pr/*`.
PROJECT="dcp-gate-site"
PROJECT_KEY="dcp-gate-site"
CRON_HOST="monkey"
CRON_ACCOUNT="dcp-gate-site"
PROJECT_REPO_PATH="$HOME/Documents/Projects/dcp-gate-site"
REPO_URL="https://github.com/hf7y/dcp-gate-site.git"
REPO_SUBDIR="."
SCHEDULER_SUBDIR=".scheduler"
ANSWER_CHANNEL="issues"
SWEEP_JOB_NAME=""
BATCH_JOB_NAME="dcp-gate-site-nightly-batch"
BATCH_PROMPT="/nightly-batch
READ CLAUDE.md IN THIS REPO BEFORE ANYTHING ELSE. It is the contract, not
background: it declares that line 1 of every issue body says who acts on it,
and it lists work an agent must never do. Those prohibitions are absolute --
never post to a forum, mailing list or social platform, never send outreach
email, never register an account anywhere as a person. Prepare substance and
draft material for a human, and stop there.
FIRST, run the repo's own router, which knows things this brief does not:
  python3 scripts/routing_audit.py
It separates the issues that are yours from the ones waiting on a person, and
flags IN-FLIGHT -- an open pull request already claiming an issue -- so you do
not redo finished work. Run it every time, before choosing anything.
Then pick ONE issue it routes to you, finish it, and close it in the same run
with a comment saying what landed and where. Triage is real work: an issue
whose premise has expired should be closed with the reason.
The default branch is \`master\`. Several gh subcommands fail on this repo with
a Projects classic GraphQL deprecation -- CLAUDE.md names the two you will hit
and the \`gh api\` form that works. Before opening a pull request,
\`python3 writing-lint/run.py .\` must pass.
If nothing is actionable, say so plainly and record DONE -- an honest empty
run beats an invented one.
When you have finished -- and BEFORE you stop -- record a verdict, so the
scheduler can tell a finished run from a truncated one:
  \$HOME/Documents/Projects/scheduler/bin/verdict.sh set dcp-gate-site <VERDICT> \"<one line why>\"
  CONTINUE   there is ACTIONABLE work left.
  DONE       the bar in the brief is met, or nothing is actionable right now.
  IMPOSSIBLE a real dead end, and further tries will not help.
Recording nothing is treated as NOT-DONE and re-dispatched."
BATCH_CRON="auto"
BATCH_MAX_TURNS="120"
USES_STANDING_RULES=1
