# abletim -- the Ableton-domain tooling (.als parsing, marker slicing).
#
# REGISTERED 2026-08-25, Zach-directed: "stand up abletim and crt and use the
# ecosystem's native way to trigger them to develop unattended."
#
# CRON_HOST/CRON_ACCOUNT are set EXPLICITLY here, unlike gardien.conf's
# defaults: schedule/ROSTER's crt and baudin comments both name the missing
# third leg ("schedule/crt.conf sets no CRON_HOST/CRON_ACCOUNT at all") as the
# reason bin/roster-diff.sh cannot corroborate a row from a third file. A new
# registration should not add another row with that gap.
PROJECT="abletim"
PROJECT_KEY="abletim"
CRON_HOST="monkey"
CRON_ACCOUNT="abletim"
PROJECT_REPO_PATH="$HOME/Documents/Projects/abletim"
REPO_URL="https://github.com/hf7y/abletim.git"
REPO_SUBDIR="."
SCHEDULER_SUBDIR=".scheduler"
SWEEP_JOB_NAME=""
BATCH_JOB_NAME="abletim-nightly-batch"
# CONVERTED (hf7y/realisateur#744): the nightly-batch procedure was written
# out once per project -- eleven near-identical copies of one seven-step
# routine. It is schedule/_run-procedure.md now, spliced in by bin/scheduler-run's
# @@FRAGMENT:@@ carrier, and only what THIS project alone needs stays below.
# Fragments are substituted AFTER this file is sourced, so a $VAR inside one
# reaches the agent as literal text; anything that must expand belongs here.
BATCH_PROMPT="@@FRAGMENT:run-procedure@@

When you have finished -- and BEFORE you stop -- record a verdict, so the
scheduler can tell a finished run from a truncated one:
  \$HOME/Documents/Projects/scheduler/bin/verdict.sh set abletim <VERDICT> \"<one line why>\"
  CONTINUE   there is ACTIONABLE work left.
  DONE       the bar in the brief is met, or nothing is actionable right now.
  IMPOSSIBLE a real dead end, and further tries will not help.
Recording nothing is treated as NOT-DONE and re-dispatched."
BATCH_CRON="auto"
BATCH_MAX_TURNS="120"
USES_STANDING_RULES=1
