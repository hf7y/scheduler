# abletim -- programmatic manipulation of Ableton Live sets (offline .als
# parsing spike + Max-for-Live/LOM spike). Scaffolded by realisateur
# 2026-07-26 from abletim.idea (vision developed via /ideate 2026-07-25).
# Registered 2026-07-26.
#
# DEXTER-PINNED (hardware-evidenced per _paced.dexter.conf's pinning bar:
# Ableton itself and the media library live on dexter -- same class of
# evidence as crt's OctoPrint). Follows the crt bootstrap precedent
# exactly: scaffolded on mandark, bare remote on mandark, REPO_URL over
# the ssh://mandark-lan git-shell-only channel so dexter's scheduler can
# clone it.
#
# ROTATION: the enabled line belongs in schedule/_paced.dexter.conf ONLY,
# written ON dexter in a human session (dexter owns that file), and flips
# to enabled=1 only after `git ls-remote` of REPO_URL succeeds FROM dexter
# (the crt bar -- see .scheduler/QUESTIONS.md in the repo). mandark's
# _paced.conf carries a parked (enabled=0) line purely to suppress
# fixed-cron here and document the pin.

PROJECT="abletim"
PROJECT_KEY="abletim"

PROJECT_REPO_PATH="/home/zach/Documents/Projects/abletim"

# Reachable from dexter via the git-shell-only dexter_mandark_deploy key
# (live-verified channel, crt precedent 2026-07-24). Not resolvable from
# mandark itself -- mandark never runs this project.
REPO_URL="git@github.com:hf7y/abletim.git"
REPO_SUBDIR="."

# Scheduler-facing files live in .scheduler/, not .claude/ -- unattended
# runs can't write .claude/ (sensitive-file gate), so the project keeps
# FOCUS/QUESTIONS/nightly-batch.md tracked under .scheduler/ from day one.
SCHEDULER_SUBDIR=".scheduler"

# ===========================================================================
# TIER 1 -- bug sweeper: DISABLED. No live tracker.
# ===========================================================================
SWEEP_JOB_NAME=""

# ===========================================================================
# TIER 2 -- overnight batch: paced participant (dexter's rotation).
# Generic bin/scheduler-run entrypoint; no .claude/commands slash command
# exists (gate above), so the prompt points at the tracked instructions.
# ===========================================================================
BATCH_JOB_NAME="abletim-nightly-batch"
BATCH_PROMPT="Read .scheduler/nightly-batch.md and follow it exactly -- it is this project's nightly-batch command. Read .scheduler/FOCUS.md before building anything. This is a fully unattended run: real Ableton sets and media (/mnt/c/...) are READ-ONLY, work on copies/fixtures only, and the M4L half can never be claimed verified without a human session."
BATCH_CRON="auto"
BATCH_MAX_TURNS="120"

# AUTONOMY_TIER "medium": code and fixtures are freely iterable, but the
# project's own hard rules (read-only real media, human-only M4L
# verification, human-only dexter registration) bound what a run may claim
# or touch -- stated in the repo's CLAUDE.md and nightly-batch.md.
AUTONOMY_TIER="medium"
