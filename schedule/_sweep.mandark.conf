# Sweep tick meta -- HOST-SCOPED to `mandark`. OPTS OUT.
#
# 2026-08-05, Zach-directed: "retire the scheduler sweep cron line so the
# clone can go." Retired the way this repo already provides for -- blanking
# SWEEP_TICK_CRON in a host-scoped conf, sourced after the shared
# schedule/_sweep.conf so it wins -- rather than by hand-editing a crontab
# that `sync-crontab.sh --apply` would silently regenerate on its next run.
# Same mechanism as _sweep.dexter.conf, _sweep.monkey.conf and
# _runner.mandark.conf, whose closing note ("WHAT THIS DOES NOT TOUCH: ...
# and the */15 sweep") this file is the follow-through on.
#
# Deleting schedule/_sweep.conf would stop the tick everywhere; this stops it
# only here, which is what was asked.
#
# WHY. The line is an ABSOLUTE PATH into the dev clone:
#   */15 * * * * /home/zach/Documents/Projects/scheduler/bin/scheduler sweep
# so while it exists the clone cannot leave mandark. `fauche` does not see
# this -- it looks for consumers reachable through git (worktrees) and never
# reads a crontab, so it reported the clone's only blocker as
# `scheduler-dose` and said nothing about a cron line calling into it every
# fifteen minutes (filed: hf7y/gardien#3).
#
# WHAT IS ACTUALLY LOST, stated plainly rather than as "it was vestigial":
#   1. The *.md auto-commit. Sweep git-add+commits FOCUS/QUESTIONS drift
#      across registered projects. This has been a mixed blessing at best --
#      it adopts a human's uncommitted edits under their name and has
#      repeatedly left them UNPUSHED. `focus-commit` is the intended path and
#      does it correctly. Losing the watcher removes a known hazard.
#   2. Re-verification of MIGRATED markers across registered projects.
#   3. The reactive backstop: stalled jobs, tripped dead-man switches, and
#      stranded commits in dedicated clones surfaced without being asked.
# (3) is the real loss and nothing replaces it today. It is a REDUCTION IN
# DETECTION, not a cleanup. `scheduler sweep` still works by hand, unchanged,
# and `scheduler` alone still prints the run ledger and the expired-jobs
# footer on demand.
#
# NOTHING SWEEPS ANY HOST AFTER THIS. dexter and monkey already opt out
# (_sweep.dexter.conf, _sweep.monkey.conf); mandark was the last one. monkey
# opts out because it holds four checkouts of the register's nineteen and
# would report on repos it cannot see -- that reasoning does not make the
# estate-wide gap disappear, it just says monkey is the wrong host to close
# it from. If the backstop is wanted back, it needs a host that can see the
# checkouts it reports on; that is a real question, not a re-enable.
#
# It also stops mailing ~7KB into a dead MTA every fifteen minutes, which
# _sweep.monkey.conf names as a reason not to copy the habit onto a second
# host. That is a side effect, not the reason.
#
# RETIRING THIS LINE IS NECESSARY BUT NOT SUFFICIENT for the clone to go.
# Still pointing into /home/zach/Documents/Projects/scheduler:
#   - ~/.local/bin/{scheduler,scheduler-dev-cycle.sh,usage-gate.sh,
#     usage-paced-runner.sh}  -- four PATH symlinks
#   - the scheduler-dose worktree (arme dose jauge rapporte relis)
# Those wait on `installe` learning to install from a verb build
# (scheduler/BLOCKERS.md, ## scheduler).
#
# TO ENABLE LATER: delete this file and re-run `bin/sync-crontab.sh --apply`
# on mandark -- and only alongside an answer to who sweeps the estate.
SWEEP_TICK_CRON=""
