# Sweep tick meta -- HOST-SCOPED to `monkey`. OPTS OUT.
#
# Blanking SWEEP_TICK_CRON suppresses the tick schedule/_sweep.conf would
# otherwise install here; this file is sourced after the shared one, so it
# wins. Same mechanism and same reasoning as _sweep.dexter.conf.
#
# WHY: `scheduler sweep` auto-commits *.md drift and re-verifies MIGRATED
# markers across every REGISTERED project, and monkey holds four checkouts out
# of the register's nineteen. A sweep here would be reporting on repos it
# cannot see -- and on mandark it already mails ~7KB into a dead MTA every
# fifteen minutes, which is not a habit worth copying onto a second host.
#
# It also keeps monkey's cron surface at exactly ONE line, which is the whole
# point of a host that does one thing.
#
# TO ENABLE LATER: delete this file, or set a real expression -- and only
# alongside a reason monkey should sweep projects it does not have.
SWEEP_TICK_CRON=""
