# senechal -- retrospective environment-observer journal for Zach's Linux
# laptop, scaffolded by realisateur from a dropped inbox note.
# Registered 2026-07-22.
#
# Follows the crt/realisateur/groc-mangr/vim-arcade/gardien precedent: git
# repo pushed to a LOCAL bare remote (no credentials/network needed),
# generic bin/scheduler-run entrypoint, joins the usage-paced governor as a
# Tier 2 participant (see schedule/_paced.conf) instead of a fixed cron time.
#
# Scope is unattended-safe because .claude/commands/nightly-batch.md
# explicitly forbids running a real scan against Zach's actual home
# directory during an unattended run -- only the scan/redaction logic
# itself gets built/tested (against temp dirs), the first real scan is
# left for Zach to run and review by hand.

PROJECT="senechal"
PROJECT_KEY="senechal"

PROJECT_REPO_PATH="/home/zach/Documents/Projects/senechal"

REPO_URL="git@github.com:hf7y/senechal.git"
REPO_SUBDIR="."

# ===========================================================================
# TIER 1 -- bug sweeper: DISABLED. senechal has no live web tracker.
# ===========================================================================
SWEEP_JOB_NAME=""

# ===========================================================================
# TIER 2 -- overnight batch: paced participant (see schedule/_paced.conf).
# ===========================================================================
BATCH_JOB_NAME="senechal-nightly-batch"
BATCH_PROMPT="/nightly-batch"
BATCH_CRON="auto"
BATCH_MAX_TURNS="120"

# AUTONOMY_TIER (declared 2026-07-26, paced cycle, per the human's
# 2026-07-25 QUESTIONS.md answer -- was deliberately left unset 2026-07-24
# rather than guessed): "medium", CONDITIONAL, not permanent. Explicitly
# NOT "high" from day one: promote to "high" only once the config files
# senechal will own actually have verified version control/redundancy in
# place -- a checkable fact, not a target date. Its eventual cross-host
# (dexter/mandark) pruning/injection of known project files is senechal's
# own scope (misattributed to scheduler in the first pass of the answer,
# corrected 2026-07-25) and is INTERIM, tied to the no-local-checkout
# redesign (FOCUS.md roadmap item 4/5) still being unfinished -- revisit
# when that lands so it doesn't quietly become permanent scope. The
# promotion condition + interim flag are routed into senechal's own
# FOCUS.md via BLOCKERS.md %%ACTION, same date.
AUTONOMY_TIER="medium"

# Migrated 2026-07-27: senechal joins the projects resolving FOCUS/QUESTIONS
# out of .scheduler/. Applied by senechal remedies/scheduler-subdir-migration.sh.
SCHEDULER_SUBDIR=".scheduler"
