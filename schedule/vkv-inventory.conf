# vkv-inventory's schedule entry. JOB_NAME/PROJECT_KEY values here match
# ~/.local/bin/vkv-inventory-bug-sweep-loop.sh and
# ~/.local/bin/vkv-inventory-nightly-batch-loop.sh exactly (both migrated
# onto lib/sweep-loop-common.sh, 2026-07-17).
#
# CRON VALUES BELOW ARE PROPOSED DEFAULTS, matching chezz.conf's own
# (9am-9pm daytime sweep window, 1am nightly batch) for consistency across
# projects -- not an independently confirmed decision for THIS project.
# Edit SWEEP_CRON/BATCH_CRON below to whatever hours are actually wanted,
# then run `bin/sync-crontab.sh --apply` again.
#
# Unlike chezz, there is no old raw crontab line to remove first --
# vkv-inventory has never had anything installed to crontab before this.

PROJECT="vkv-inventory"
# Where this project's own working copy lives -- used by bin/sync-crontab.sh
# to symlink its .claude/QUESTIONS.md into ../questions/<PROJECT>.md, so
# every project's flagged questions are browsable from one place without
# duplicating the file. Optional: leave blank/omit to skip the symlink for
# a project that doesn't have a local working copy in this exact shape.
PROJECT_REPO_PATH="/home/zach/Documents/vkv/inv/inventory-app"

# PAUSED 2026-07-19 pending migration into the usage-paced governor (see
# scheduler-usage-pacing task backlog) -- fixed-cron Tier 1 sweeps compete
# with the burn-rate pacing on Tier 2, so sweeps are parked (blank
# SWEEP_JOB_NAME = tier disabled, per sync-crontab.sh) until they're folded
# into usage-gate.sh dispatch too. To re-enable as-is in the meantime,
# restore SWEEP_JOB_NAME/SWEEP_SCRIPT/SWEEP_CRON below + re-run
# bin/sync-crontab.sh --apply.
SWEEP_JOB_NAME=""
# SWEEP_SCRIPT="/home/zach/.local/bin/vkv-inventory-bug-sweep-loop.sh"
# SWEEP_CRON="*/15 9-21 * * *"

# TIER 2 -- overnight batch: runs under the svc-vaporwave account, via that
# account's ~/bin/vkv-inventory-nightly-batch-loop.sh (same
# lib/sweep-loop-common.sh engine, different REPO_URL/SSH alias/deploy key).
#
# 2026-07-25 CORRECTION. This block used to say the 2026-07-20 migration
# "was never completed" and that this project had zero dispatch for days.
# Wrong, and repeated into _paced.conf, DESIGN-NOTES.md and FABLE_REPORT.md
# (ranked its #1 finding). svc-vaporwave's crontab, read 2026-07-25, has
# been running both jobs all along -- this one at 04:00, which is what the
# Claude session found active under that account at 04:01 that morning.
# What was true is narrower: it stopped dispatching from *zach's* account,
# and nobody checked the other one.
#
# The lines below ADOPT the existing entry rather than change it: BATCH_CRON
# is the time already installed, so registering with sync-crontab.sh is a
# no-op for behavior and a gain for ownership.
#
# BATCH_JOB_NAME must equal the wrapper's own JOB_NAME -- it is the
# lock/state key (<that account's home>/.local/share/<JOB_NAME>/) the expiry
# check and any liveness audit resolve against. Verify with:
#     sudo -u svc-vaporwave grep '^JOB_NAME=' ~svc-vaporwave/bin/vkv-inventory-nightly-batch-loop.sh
BATCH_JOB_NAME="vkv-inventory-nightly-batch"
BATCH_SCRIPT="/home/svc-vaporwave/bin/vkv-inventory-nightly-batch-loop.sh"
BATCH_CRON="0 4 * * *"

# --- Dispatch ownership (2026-07-25) --------------------------------------
# See aedile.conf's block of the same name for the full rationale. Pinned to
# mandark; moving the service account to dexter is a one-field edit
# (CRON_HOST="dexter"), and re-running here then retracts the old lines
# instead of orphaning them.
CRON_ACCOUNT="svc-vaporwave"
CRON_HOST="mandark"

# AUTONOMY_TIER (raised 2026-07-25, human-directed: "these are not risky
# changes that need me at the gate" -- see lib/autonomy-merge.sh, built
# same day to actually enforce this field). Was "medium" since 2026-07-24
# (declared, unenforced).
#
# UNGATED -- no BATCH_TEST_CMD/SWEEP_TEST_CMD is set, because this project
# has no test suite at all (a Google Apps Script project, confirmed
# 2026-07-25). This is safe ONLY because REPO_URL above
# (git@github-vkv-deploy:media-arts-collective/inventory-app.git, cloned
# to this project's dedicated clone) is a DEVELOPMENT CLONE, NOT the live
# media-arts-collective inventory site other people actually use.
# Auto-merging here moves this clone's own main branch; it does NOT
# deploy to production. Deploy-to-production stays a separate, human-
# gated step regardless of this tier -- if that separation ever changes
# (e.g. this clone becomes the source of an auto-deploy), this tier needs
# re-review before it does.
AUTONOMY_TIER="high"
