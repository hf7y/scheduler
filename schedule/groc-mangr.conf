# groc-mangr -- REGISTERED 2026-08-05, Zach-directed ("register the other five"),
# alongside arming chezz. Registered is not armed: there is NO row for this
# project in any schedule/_paced*.conf and no EXEMPT line in schedule/FREEZE,
# so nothing dispatches it. Registration makes it a known participant --
# which is what install-verbs.sh's "registered" column reads, and what makes
# its declared verb accountable to something.
#
# WHY IT WAS NOT ARMED. Three preconditions are unmet, and each would produce
# a specific failure rather than a slow start:
#   1. No .scheduler/ directory in the repo -- no FOCUS.md, no QUESTIONS.md.
#      BATCH_PROMPT below runs /nightly-batch, which builds against FOCUS.md's
#      stated priorities. With no FOCUS.md there is nothing to build against.
#   2. No unix account on monkey. An enabled row whose command path does not
#      exist makes every runner log "SKIP groc-mangr -- command not runnable" on
#      EVERY tick -- ~48 lines a night at the current 0,30 cadence, in the
#      same run.log someone is reading to see how the night went. Stand the
#      account up first with realisateur bin/setup-selfdev-project.sh.
#   3. Arming spends a shared weekly quota. That is a judgment, and every
#      guard in this ecosystem stops one step short of it.
#
# PROBED 2026-08-05 rather than assumed:
#   * hf7y/groc-mangr -- PRIVATE, default branch `feature/receipt-ocr`, last pushed 2026-07-30.
#   * carries a `bashified` branch, and therefore declares a verb.
#   * DEFAULT IS A FEATURE BRANCH, `feature/receipt-ocr`, and `main` also
#     exists. Checked before assuming this was the realisateur#39 defect:
#       gh api repos/hf7y/groc-mangr/compare/main...feature/receipt-ocr
#       ahead_by=0 behind_by=9 status=behind
#     `main` is NINE COMMITS BEHIND the feature branch, so the default is
#     RIGHT and main is the stale one. Do not "repair" this by flipping the
#     default to main -- that would retarget work onto a stale branch. The
#     real cleanup is to land the feature branch into main, in that repo.
#
# BRANCH NAME IS LOAD-BEARING AND scheduler CANNOT PIN IT. There is no
# BATCH_BRANCH field anywhere in this repo -- `scheduler-run` resolves the
# repository's DEFAULT branch when nothing says otherwise. That is exactly
# realisateur#39: vim-arcade's default was `tmux-pane-mechanic`, a PR merged
# into it, and its content was absent from main while both sides reported
# success. Recorded here because this project's default is `feature/receipt-ocr`, so anyone
# arming it must confirm that is still the branch the work is on.

PROJECT="groc-mangr"
PROJECT_KEY="groc-mangr"
# Self-dev lives on monkey (realisateur/MONKEY.md). CRON_HOST keeps mandark from
# emitting these lines; CRON_ACCOUNT is STATE ownership (scheduler#33 -- four
# monkey jobs read 7-12d idle while running daily because no conf set it).
CRON_HOST="monkey"
CRON_ACCOUNT="groc-mangr"
PROJECT_REPO_PATH="$HOME/Documents/Projects/groc-mangr"
REPO_URL="https://github.com/hf7y/groc-mangr.git"
REPO_SUBDIR="."
# .scheduler/, not the default .claude/: an UNATTENDED run cannot write under
# .claude/ (harness sensitive-file gate) and would read its own brief while
# silently failing to record anything. Files moved by hf7y/groc-mangr PR (2026-08-12);
# this line is the half that makes sync-crontab.sh and `scheduler` look there.
SCHEDULER_SUBDIR=".scheduler"
SWEEP_JOB_NAME=""
# TIER 2 RESTORED 2026-08-12, Zach-directed ("move sequestria, groc-mangr, crt,
# secretaire and ensure they will trigger when the gate opens"). It was blank
# because on 2026-08-05 five such confs put FIXED nightly lines into chezz's
# crontab for projects with no clone and no FOCUS.md. That cannot recur here:
# this project now has an account, a clone and an ENABLED row in
# schedule/_paced.monkey.conf, and membership in that rotation is exactly what
# suppresses the fixed line (bin/sync-crontab.sh, "MEMBERSHIP ALONE SUPPRESSES").
# BATCH_JOB_NAME is still required -- `scheduler-run <p> batch` exits 2 without
# it -- so a blank one is not "unarmed", it is "armed and broken".
#
# WHAT HELD IT SHUT UNTIL 2026-08-13: schedule/FREEZE, which carried no EXEMPT
# line for this project, so freeze-check.sh refused at dispatch and the runner
# logged FROZEN. Zach opened that line in session on 2026-08-13 -- see the block
# above `EXEMPT: groc-mangr@monkey` in schedule/FREEZE for what was probed
# first. This project now dispatches. The remaining brake is not mechanical:
# the first ticks are meant to be hand-triggered and watched.
BATCH_JOB_NAME="groc-mangr-nightly-batch"
# CONVERTED (hf7y/realisateur#744): the nightly-batch procedure was written
# out once per project -- eleven near-identical copies of one seven-step
# routine. It is schedule/_run-procedure.md now, spliced in by bin/scheduler-run's
# @@FRAGMENT:@@ carrier, and only what THIS project alone needs stays below.
# Fragments are substituted AFTER this file is sourced, so a $VAR inside one
# reaches the agent as literal text; anything that must expand belongs here.
BATCH_PROMPT="@@FRAGMENT:run-procedure@@

BEFORE ANYTHING ELSE, read the standing brief. It lives in the issue queue, as
the one open issue labelled 'playbook', because that is a channel Zach can edit
from his phone and an unattended run cannot rewrite:
  gh issue list --repo hf7y/groc-mangr --label playbook --state open --json number
There must be EXACTLY ONE. Two briefs that disagree is worse than none: if you
see two, STOP and record IMPOSSIBLE naming both. If you see none, STOP and
record IMPOSSIBLE -- do not proceed on an empty brief. Then read it:
  gh issue view <n> --repo hf7y/groc-mangr
This snippet is retyped logic and that is a known defect, tracked as
hf7y/realisateur#244: the real door is realisateur's bin/playbook.sh, which is
LOCAL today and therefore does not exist on this account. When #244 lands,
this becomes one command and this paragraph goes away. Do not proceed on the queue alone: the queue is issues, the
brief is what they are FOR, and a run that works the queue without the brief is
the failure this arrangement exists to prevent. The brief outranks anything in
this prompt except the verdict step.
When you have finished -- and BEFORE you stop -- record a verdict, so the
scheduler can tell a finished run from a truncated one:
  \$HOME/Documents/Projects/scheduler/bin/verdict.sh set groc-mangr <VERDICT> \"<one line why>\"
  CONTINUE   there is ACTIONABLE work left.
  DONE       the bar in the brief is met, or nothing is actionable right now.
  IMPOSSIBLE a real dead end, and further tries will not help.
Recording nothing is treated as NOT-DONE and re-dispatched."
BATCH_CRON="auto"
BATCH_MAX_TURNS="120"
USES_STANDING_RULES=1
