# baudin -- REGISTERED 2026-08-05, Zach-directed ("register the other five"),
# alongside arming chezz. Registered is not armed: there is NO row for this
# project in any schedule/_paced*.conf and no EXEMPT line in schedule/FREEZE,
# so nothing dispatches it. Registration makes it a known participant --
# which is what install-verbs.sh's "registered" column reads, and what makes
# its declared verb accountable to something.
#
# WHY IT WAS NOT ARMED. Three preconditions are unmet, and each would produce
# a specific failure rather than a slow start:
#   1. No .scheduler/ directory in the repo -- no FOCUS.md, no QUESTIONS.md.
#      BATCH_PROMPT below runs /nightly-batch, which builds against FOCUS.md's
#      stated priorities. With no FOCUS.md there is nothing to build against.
#   2. No unix account on monkey. An enabled row whose command path does not
#      exist makes every runner log "SKIP baudin -- command not runnable" on
#      EVERY tick -- ~48 lines a night at the current 0,30 cadence, in the
#      same run.log someone is reading to see how the night went. Stand the
#      account up first with realisateur bin/setup-selfdev-project.sh.
#   3. Arming spends a shared weekly quota. That is a judgment, and every
#      guard in this ecosystem stops one step short of it.
#
# PROBED 2026-08-05 rather than assumed:
#   * hf7y/baudin -- PRIVATE, default branch `master`, last pushed 2026-07-30.
#   * carries a `bashified` branch, and therefore declares a verb.
#   * default is `master`, and there is no `main`. Not a defect -- that IS
#     its branch. Named so a later reader does not "fix" it into main.
#
# BRANCH NAME IS LOAD-BEARING AND scheduler CANNOT PIN IT. There is no
# BATCH_BRANCH field anywhere in this repo -- `scheduler-run` resolves the
# repository's DEFAULT branch when nothing says otherwise. That is exactly
# realisateur#39: vim-arcade's default was `tmux-pane-mechanic`, a PR merged
# into it, and its content was absent from main while both sides reported
# success. Recorded here because this project's default is `master`, so anyone
# arming it must confirm that is still the branch the work is on.

PROJECT="baudin"
PROJECT_KEY="baudin"
# The gap schedule/ROSTER named while this was parked: with neither set, dose
# has no host or account to converge a crontab for, and the row dispatches
# nothing. hf7y/scheduler#33 was one unset CRON_ACCOUNT.
CRON_HOST="monkey"
CRON_ACCOUNT="baudin"
PROJECT_REPO_PATH="$HOME/Documents/Projects/baudin"
REPO_URL="https://github.com/hf7y/baudin.git"
REPO_SUBDIR="."
SWEEP_JOB_NAME=""
# TIER 2 ARMED 2026-08-05, immediately after crt (#45), same Zach direction in
# the same session: "merged both, arm baudin too". baudin is second on the
# sprint doc's readiness table (SPRINT-RECORD-2026-08-05.md section 9): issue #1
# plus CONTRACT.md's two named "cheapest summons". Its milestone is
# hardware-blocked; the software work is what an agent can actually reach.
#
# These two values were blank until now, and the blank was load-bearing:
# sync-crontab.sh enables the batch tier unless BATCH_JOB_NAME, BATCH_SCRIPT and
# BATCH_CRON are ALL empty (bin/sync-crontab.sh:678); with any one of them set
# and NO PACED ROW TO SUPPRESS IT, the project gets a FIXED nightly cron line.
# That is the 2026-08-05 bug where five projects with no clone and no FOCUS.md
# had five stray nightly lines installed in chezz's crontab.
#
# So these values are safe ONLY alongside the baudin row in _paced.monkey.conf,
# added in the same commit. The witness that the suppression works is a line in
# the sync-crontab.sh PREVIEW reading
#   note [baudin/BATCH]: paced participant -- fixed cron suppressed
# which is exactly what crt's preview emitted before --apply. If that note is
# absent and a fixed nightly line appears instead, DO NOT APPLY.
#
# Preconditions probed on monkey before arming, not assumed:
#   - account baudin exists; scheduler clone up to date, tracked tree clean
#     (a dirty tracked file silently freezes a dispatcher -- section 4b)
#   - brief present at .claude/FOCUS.md (baudin sets no SCHEDULER_SUBDIR, so
#     sync-crontab.sh:635 defaults to .claude -- which is where it is)
#   - DEFAULT BRANCH IS `master`, NOT `main`, and origin/HEAD agrees. Checked
#     explicitly because this is the groc-mangr#2 trap, where the default
#     branch was a feature branch 9 commits behind the branch the brief lived
#     on -- an armed agent there would read a stale brief and push to it.
#   - credentials live: `claude -p 'reply ok'` returned ok as user baudin under
#     a stripped, cron-shaped environment
BATCH_JOB_NAME="baudin-nightly-batch"
# CONVERTED (hf7y/realisateur#744): the nightly-batch procedure was written
# out once per project -- eleven near-identical copies of one seven-step
# routine. It is schedule/_run-procedure.md now, spliced in by bin/scheduler-run's
# @@FRAGMENT:@@ carrier, and only what THIS project alone needs stays below.
# Fragments are substituted AFTER this file is sourced, so a $VAR inside one
# reaches the agent as literal text; anything that must expand belongs here.
BATCH_PROMPT="@@FRAGMENT:run-procedure@@

Live state comes from ./bin/ha-probe.sh -- run it, never re-type a sentence
about the instance. It needs .session-handoff/ha_token, which this account does
NOT have (hf7y/baudin#7); if that is still true, say so and work what does not
need the API rather than reporting a blocked run.
When you have finished -- and BEFORE you stop -- record a verdict, so the
scheduler can tell a finished run from a truncated one:
  \$HOME/Documents/Projects/scheduler/bin/verdict.sh set baudin <VERDICT> \"<one line why>\"
  CONTINUE   there is ACTIONABLE work left.
  DONE       the bar in the brief is met, or nothing is actionable right now.
  IMPOSSIBLE a real dead end, and further tries will not help.
Recording nothing is treated as NOT-DONE and re-dispatched."
BATCH_CRON="auto"
BATCH_MAX_TURNS="120"

# 2026-08-17: these rules were written for every dispatched account, and four
# projects were not reading them. hf7y/realisateur#127.
USES_STANDING_RULES=1
