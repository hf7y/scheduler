# Paced-runner tick meta -- HOST-SCOPED to `mandark`. OPTS OUT.
#
# 2026-08-03, Zach: "delete it via dog fooding if possible." So mandark's
# runner line is retired the way this repo already provides for -- blanking
# RUNNER_CRON in a host-scoped conf, the same mechanism _sweep.dexter.conf has
# used since 2026-07-29 -- rather than by hand-editing a crontab that
# `sync-crontab.sh --apply` would silently regenerate on its next run.
#
# WHY RETIRE IT AT ALL, given the rotation is empty. An empty rotation is not
# the same as no dispatcher. mandark's runner still woke four times a day and
# still called usage-gate.sh, spending a quota probe against the SHARED weekly
# budget for work it could not do. And "monkey is the only dispatcher" is
# worth being a fact about the crontab rather than a fact about a conf nobody
# re-reads -- self-dev moving off mandark is the point of the whole migration
# (realisateur/MONKEY.md, THE-UNWIRING.md).
#
# WHAT THIS DOES NOT TOUCH: the */30 ecosim-sensor-tick MONITOR line, which is
# an offline sensor that never spends, and the */15 sweep. Only agent dispatch
# leaves mandark here.
#
# TO REVERSE: delete this file. _runner.conf's shared value applies again and
# the next --apply restores the line.
RUNNER_CRON=""
