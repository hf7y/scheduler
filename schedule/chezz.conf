# chezz -- the game. RE-REGISTERED 2026-08-04 to move it onto monkey.
#
# Zach, 2026-08-04: "move over one more service to monkey and get it set up.
# I think chezz would be good."
#
# WHY THERE WAS NO conf FILE TO EDIT. chezz used to be a participant and was
# deregistered: schedule/_paced.conf's own footer still records it --
# "Rows removed here: chezz, chezz-sweep, home-assistant, vkv-inventory, ..."
# -- and this file was deleted with them, while _paced.conf line 116 kept
# pointing at "schedule/chezz.conf" for an explanation that no longer existed.
# That dangling reference is repaired by this file existing again.
#
# WHERE THE PROJECT ACTUALLY IS, re-probed 2026-08-04 rather than assumed:
#   * hf7y/chezz on GitHub -- PUBLIC, default branch main, last pushed
#     2026-08-01. Substantial: index1.html, package.json, playwright config,
#     leaderboard/, tools/, .clasp.json (Google Apps Script), and its own
#     .scheduler/FOCUS.md + QUESTIONS.md. Scheduler-shaped already.
#   * /home/zach/ecosystem1/ecosystem1/chezz -- a CONSIGNED copy in the vault
#     (front-matter: consigned 2026-08-01), not a working tree.
#   * /home/zach/Documents/Project Archive/chezz -- the path the consign
#     header names as its source. GONE as of 2026-08-04.
# So the GitHub remote is the only canonical copy, which is what makes moving
# it to a fresh host a clone rather than a migration. Nothing has to be
# rescued off mandark first.
#
# PUBLIC REPO, unlike every other self-dev participant. Two consequences worth
# stating because they are easy to get wrong in opposite directions:
#   * the read path needs no credential at all;
#   * the WRITE path still does, and `bin/wire-selfdev-git.sh chezz --apply
#     --rw` issues a read-write deploy key exactly as for a private repo.
#     ecosim's own scheduler key is read-only on a public repo for the same
#     reason: the wiring rewrites every github.com URL onto a per-repo alias,
#     so "public" changes nothing about which key is presented.

PROJECT="chezz"
PROJECT_KEY="chezz"
# --- which account and host own this job's STATE (2026-08-05) ---------------
# CRON_ACCOUNT is what `scheduler`'s state_account()/state_home()/state_run()
# read to answer "whose ~/.local/share holds this job's run log". Until today
# NO conf in this repo set it, so state_account() always returned empty,
# state_home() always fell back to $HOME, and the whole per-account
# abstraction -- including its BLIND state -- had never once been exercised.
# That is why the glance reported these four as 7-12d idle and dead-man
# expired while they ran daily on monkey (hf7y/scheduler#33).
#
# CRON_HOST is set ALONGSIDE it, and is load-bearing rather than decorative.
# sync-crontab.sh checks CRON_HOST FIRST and `continue`s cleanly; without it,
# the next guard would fire `ERROR: CRON_ACCOUNT=chezz is not a user on mandark
# -- skipping this conf` on every sync from mandark, because chezz is a real
# account only on monkey. Host first, account second, in that order.
CRON_HOST="monkey"
CRON_ACCOUNT="chezz"


PROJECT_REPO_PATH="$HOME/Documents/Projects/chezz"

REPO_URL="https://github.com/hf7y/chezz.git"
REPO_SUBDIR="."

# ===========================================================================
# TIER 1 -- bug sweeper: BLANK, and not merely "not yet".
# ===========================================================================
# monkey opts OUT of the sweep tick at the host level (_sweep.monkey.conf
# blanks SWEEP_TICK_CRON), so a job name here would be inert on this host and
# would read as armed to anyone who did not know that. chezz DID have a Tier 1
# sweep on mandark -- ~/.local/share/chezz-bug-sweep still holds its state, and
# INCIDENT-2026-08-01-bug-sweep-oidc.md in the repo is about that sweep hitting
# an OIDC failure. Reviving it is a separate decision from moving the project,
# and it belongs to whoever reads that incident first.
SWEEP_JOB_NAME=""

# ===========================================================================
# TIER 2 -- overnight batch.
# ===========================================================================
BATCH_JOB_NAME="chezz-nightly-batch"

# THE VERDICT BLOCK IS NOT BOILERPLATE -- it is here from the start because
# both projects that went before had to learn it the hard way.
# bin/usage-paced-runner.sh classifies every finished run through verdict.sh: a
# run that records nothing is NOT-DONE and gets re-dispatched with metabolism
# untouched. ecosim's first dispatch from monkey did 835s of real work, pushed
# two commits, recorded nothing, and was indistinguishable from a crash
# (fixed 2026-08-03). bibliothecaire then shipped WITH the ask and still looped,
# because "CONTINUE (queue not empty)" is the wrong test when the only thing
# open is blocked on a human (fixed 2026-08-04). Both fixes are folded in below.
#
# $HOME expands because schedule/*.conf is SOURCED, unlike _paced*.conf which is
# read with `while IFS='|' read` -- MONKEY.md section 4.
BATCH_PROMPT="/nightly-batch

When you have finished -- and BEFORE you stop -- record a verdict, so the
scheduler can tell a finished run from a truncated one:

  \$HOME/Documents/Projects/scheduler/bin/verdict.sh set chezz <VERDICT> \"<one line why>\"

  CONTINUE   there is ACTIONABLE work left -- something you could pick up on
             the next run without anyone else acting first.
  DONE       the bar in the brief is met, or nothing is actionable right now.
             This INCLUDES work that is blocked waiting on a human: you asked,
             and the answer arrives when it arrives. Recording CONTINUE there
             gets you re-dispatched every tick to re-read something that has
             not changed, which spends real quota to learn nothing.
  IMPOSSIBLE a real dead end, and further tries will not help. NOT merely
             running out of turns -- that is CONTINUE.

Recording nothing is treated as NOT-DONE and re-dispatched, which is the safe
default but makes a good run look identical to a crash."

BATCH_CRON="auto"
BATCH_MAX_TURNS="120"

# AUTONOMY_TIER "medium", matching ecosim rather than inventing a level for a
# project whose autonomy has not been re-argued since it was deregistered.
# Reversible in-repo work is autonomous; anything that installs, symlinks,
# crontabs, or runs a --commit path is not. chezz additionally touches a
# DEPLOYED artifact (Apps Script via .clasp.json, and a leaderboard), and
# pushing to either is exactly the kind of outward-facing act "medium" excludes.
AUTONOMY_TIER="medium"
