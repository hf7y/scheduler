# chezz's schedule entry. JOB_NAME/PROJECT_KEY values here match
# ~/.local/bin/chezz-bug-sweep-loop.sh and
# ~/.local/bin/chezz-nightly-batch-loop.sh exactly (confirmed 2026-07-17).
#
# CRON VALUES BELOW ARE PROPOSED DEFAULTS, NOT A CONFIRMED DECISION --
# they're exactly the example numbers this repo's own README floated
# under "Open decisions" (9am-9pm daytime sweep window, 1am nightly
# batch). Chezz's real crontab entry today is still the original
# `*/15 * * * *` with NO window at all. Edit SWEEP_CRON/BATCH_CRON below
# to whatever hours are actually wanted, then run
# `bin/sync-crontab.sh --apply`.
#
# MIGRATION NOTE (resolved 2026-07-17): the old raw unmanaged crontab line
# was removed by hand and this file applied -- chezz's crontab is now
# fully scheduler-managed, no duplicate firing.

PROJECT="chezz"
# Where this project's own working copy lives -- used by bin/sync-crontab.sh
# to symlink its $SCHEDULER_SUBDIR/QUESTIONS.md into ../questions/<PROJECT>.md
# and its $SCHEDULER_SUBDIR/FOCUS.md into ../focus/<PROJECT>.md.
#
# MIGRATED 2026-07-25 (human-directed, interactive session): chezz did its
# side of the `.claude/` -> `.scheduler/` move on 2026-07-24 (git mv, real
# files, history preserved) and correctly refused to edit THIS repo from
# there -- so both symlinks dangled for a day and `scheduler status chezz`
# reported "no FOCUS.md found" while chezz/.scheduler/FOCUS.md was a real
# 271-line file. SCHEDULER_SUBDIR below is that missing half.
# The original rationale, still accurate: FOCUS/QUESTIONS under .claude/
# hit the unattended "sensitive file" write gate (confirmed path-based via
# a controlled A/B test), which is why the fix is a TOP-LEVEL dir and not
# a nested .claude/scheduler/. Command files stay at .claude/commands/ --
# only scope/questions moved, matching scheduler's own reference layout.
SCHEDULER_SUBDIR=".scheduler"
PROJECT_REPO_PATH="/home/zach/Documents/Project Archive/chezz"

# Runtime config for bin/scheduler-run, migrated from
# ~/.local/bin/chezz-nightly-batch-loop.sh (MIGRATION.md step 1, 2026-07-19).
# BATCH_SCRIPT below is still set, so it stays authoritative for now (see
# sync-crontab.sh precedence) -- these fields are inert until a human drops
# BATCH_SCRIPT and re-runs sync-crontab.sh --apply to flip the switch.
REPO_URL="git@github-chezz-deploy:hf7y/chezz.git"
REPO_SUBDIR="."
BATCH_MAX_TURNS="200"
BATCH_EXPIRY_DAYS="7"
BATCH_PROMPT="/nightly-batch

This is a fully unattended overnight run with no human review step. Read .scheduler/FOCUS.md FIRST -- everything you do tonight is scoped by that file. An accumulated feature idea or bug report that is not in service of the current focus should be written up as deferred in tonight's report, not implemented, no matter how easy it looks.

Write your report to ~/reports/chezz/\$(date +%Y-%m-%d).md and update ~/reports/chezz/LATEST.md to match it, so it is a 30-second read the next time this machine boots up, covering: what shipped, what broke and got fixed, what was deliberately deferred and why, and any open questions that need a human decision. Confirm everything is committed and pushed to origin/main before finishing -- an overnight run that isn't saved anywhere didn't happen."

# FOLDED INTO THE PACED ROTATION 2026-07-25 (paced cycle, FOCUS.md
# "Consolidation roadmap" axis 2). Was PAUSED 2026-07-19 (fixed-cron Tier 1
# sweeps competing with the burn-rate pacing on Tier 2) -- now dispatched as
# its own participant, `chezz-sweep`, in schedule/_paced.conf, same rotation
# as every Tier 2 batch. SWEEP_JOB_NAME/SWEEP_SCRIPT stay set here (matching
# the BATCH_JOB_NAME/BATCH_SCRIPT pattern above) so `bin/scheduler`'s status/
# registry lookups (SWEEP_JOB_NAME) still resolve this tier's state, but
# bin/sync-crontab.sh now suppresses the fixed-cron line for any project
# that's a paced participant (mirrors the existing BATCH suppression --
# fixed 2026-07-25, previously this tier had no such check, a real gap: it
# would have double-dispatched the sweep, once via cron and once via the
# paced runner, had this been "un-paused" by literally restoring SWEEP_CRON
# as this comment used to say). No SWEEP_CRON is set -- that's what tells
# sync-crontab.sh which fixed cadence to fall back to if this project were
# ever taken OUT of the paced rotation; leaving it unset is deliberate, not
# an oversight. Revert: `enabled|0|` the `chezz-sweep` line in
# schedule/_paced.conf and restore `SWEEP_CRON="*/15 0,2-23 * * *"` here to
# go back to fixed-cron dispatch.
SWEEP_JOB_NAME="chezz-bug-sweep"
SWEEP_SCRIPT="/home/zach/.local/bin/chezz-bug-sweep-loop.sh"

BATCH_JOB_NAME="chezz-nightly-batch"
BATCH_SCRIPT="/home/zach/.local/bin/chezz-nightly-batch-loop.sh"
BATCH_CRON="auto"  # let bin/sync-crontab.sh assign a batch slot (see
                    # schedule/_batch.conf) instead of a hand-picked time

# AUTONOMY_TIER (declared 2026-07-24, paced cycle -- axis 1.5, formalizing
# EXISTING policy, no behavior change): "medium" -- matches the
# already-decided FOCUS.md "Target UX" mockup (2026-07-20) and chezz's own
# current push policy (may push directly to main, flagged + revertible;
# no autonomous merge/deploy).
AUTONOMY_TIER="medium"
