# aedile -- AI email-operations role for the Virtual Krewe of Vaporwave
# (Media Arts Collective, co-directed by Zach and Tyler). Lives at
# aedile/ inside the shared GitHub monorepo
# git@github.com:media-arts-collective/wavebucks.git. Registered 2026-07-20.
#
# BESPOKE WRAPPER, not the shared engine / bin/scheduler-run -- see
# ~/.local/bin/aedile-nightly-batch-loop.sh's own header for why:
#   1. Shared, co-owned repo -- REVIEW-GATED, never auto-push/auto-merge
#      (explicit human choice 2026-07-20, over a direct-push alternative).
#      Commits land on aedile-nightly/<date>, based on context-tiers (where
#      the live work is, not main) for manual review + merge.
#   2. The real working copy routinely carries uncommitted WIP that the
#      user wants each cycle to pick up (also an explicit 2026-07-20
#      choice) -- the wrapper works in a `git worktree` off the REAL local
#      clone (stash-transplanted in), not a disposable network clone, so
#      that WIP is visible to the run. Verified 2026-07-20 (SCHED_DRYRUN=1)
#      that the real working copy's uncommitted files survive byte-identical
#      after a cycle.
#
# No deploy key / SSH alias needed for this project: the wrapper never
# fetches or pushes over the network (worktree is local-only by design),
# so cron's missing ssh-agent (see scheduler-cron-ssh-auth) doesn't apply.

PROJECT="aedile"
PROJECT_KEY="aedile"

# Real working copy (used for the focus/+questions/ symlinks). The
# scheduler job itself operates on this SAME clone via a worktree -- not a
# separate dedicated clone -- see the wrapper.
PROJECT_REPO_PATH="/home/zach/Documents/vkv/wavebucks/aedile"

# FOCUS.md/QUESTIONS.md live outside .claude/ deliberately -- that dir is
# gitignored in the shared wavebucks monorepo (co-owned with Tyler's
# unrelated projects), so a plain .claude/FOCUS.md would never reach a
# fresh clone (svc-vaporwave's dispatch, or milestone-audit.sh/sync's own
# path resolution). Found 2026-07-24 via realisateur's /ideate aedile --
# milestone-audit.sh already supported this override (used by `scheduler`
# itself) but aedile never set it, so it was misread as having no
# FOCUS.md/milestone every pass despite a real, tracked one existing.
SCHEDULER_SUBDIR=".scheduler"

# ===========================================================================
# TIER 1 -- bug sweeper: DISABLED. No live tracker to sweep, and aedile's
# safety model (draft-only, allowlists, kill switch) makes a fast
# unreviewed sweep the wrong shape of job for this project regardless.
# ===========================================================================
SWEEP_JOB_NAME=""

# ===========================================================================
# TIER 2 -- overnight batch: runs under the svc-vaporwave account, via the
# rewritten fresh-clone/always-push wrapper in that account's ~/bin (NOT
# the worktree-based one described above, which assumes a real interactive
# working copy svc-vaporwave doesn't have).
#
# 2026-07-25 CORRECTION. This block used to say the 2026-07-20 migration
# "was never completed" and that this project had zero dispatch for days.
# That was wrong, and it was repeated into _paced.conf, DESIGN-NOTES.md and
# FABLE_REPORT.md (where it was ranked the #1 finding). svc-vaporwave's
# crontab was read on 2026-07-25 and has been running BOTH jobs all along:
#     0 3 * * * /home/svc-vaporwave/bin/aedile-nightly-batch-loop.sh
#     0 4 * * * /home/svc-vaporwave/bin/vkv-inventory-nightly-batch-loop.sh
# What was actually true is narrower: it stopped dispatching from *zach's*
# account, and nobody checked the other one. "I looked and saw nothing" was
# never distinguished from "I did not look" -- the same shape as the
# credential-gap retraction.
#
# The lines below ADOPT those two existing entries rather than change them:
# BATCH_CRON is set to the time already installed, so registering this with
# sync-crontab.sh is a no-op for behavior and a gain for ownership -- the
# conf becomes the source of truth and drift becomes visible.
#
# BATCH_JOB_NAME must equal the JOB_NAME the wrapper sets internally: it is
# the lock/state key (<that account's home>/.local/share/<JOB_NAME>/), which
# is what the expiry check and any liveness audit resolve against. A
# mismatch won't stop the job running -- it just makes the audit trail
# point at a directory that doesn't exist. Verify with:
#     sudo -u svc-vaporwave grep '^JOB_NAME=' ~svc-vaporwave/bin/aedile-nightly-batch-loop.sh
# ===========================================================================
BATCH_JOB_NAME="aedile-nightly-batch"
BATCH_SCRIPT="/home/svc-vaporwave/bin/aedile-nightly-batch-loop.sh"
BATCH_CRON="0 3 * * *"

# --- Dispatch ownership (2026-07-25) --------------------------------------
# Installed and owned by bin/sync-crontab.sh's per-account managed block,
# not by hand. The 2026-07-20 install WAS hand-rolled, which is why its
# state could drift from every record of it for five days without anything
# noticing.
#
# CRON_HOST pins this to mandark, which makes moving the service account to
# dexter a ONE-FIELD edit: set CRON_HOST="dexter", run sync-crontab.sh
# --apply on dexter to install, then re-run it on mandark to retract (an
# off-host conf yields an EMPTY managed block, so the old lines are removed
# rather than orphaned -- exactly the failure this project just lived).
#
# _paced.conf keeps this project at 0 deliberately: 0 means "zach's paced
# runner does not dispatch it", which is correct -- svc-vaporwave's crontab
# does. sync-crontab.sh errors if both are ever true at once.
CRON_ACCOUNT="svc-vaporwave"
CRON_HOST="mandark"

# AUTONOMY_TIER (declared 2026-07-24, paced cycle -- axis 1.5, formalizing
# EXISTING policy, no behavior change): "low" -- this conf's own header
# above states aedile is "REVIEW-GATED, never auto-push/auto-merge",
# commits land on aedile-nightly/<date> for manual review. Matches the
# vision doc's "low" definition (branch-only, human merges by hand)
# exactly.
AUTONOMY_TIER="low"
