# quatre-vingt-douze -- "page 92": scrape public-domain texts, extract page 92
# from each, side-by-side gallery for hand-arrangement (the arranging is
# never automated -- user judgment is the product). Scaffolded by
# realisateur 2026-07-26 from bibliothecaire.idea (as "bibliothecaire").
# Registered 2026-07-26; renamed to quatre-vingt-douze same day -- Zach's
# /ideate call: the librarian project owns the old name. Collision closed.
#
# Follows the nine-speakers precedent: local bare remote (no credentials/
# network needed for git), generic bin/scheduler-run entrypoint, paced
# participant in schedule/_paced.conf.
#
PROJECT="quatre-vingt-douze"
PROJECT_KEY="quatre-vingt-douze"

PROJECT_REPO_PATH="/home/zach/Documents/Projects/quatre-vingt-douze"

REPO_URL="https://github.com/hf7y/quatre-vingt-douze.git"
REPO_SUBDIR="."

# Scheduler-facing files live in .scheduler/, not .claude/ -- unattended
# runs can't write .claude/ (sensitive-file gate).
SCHEDULER_SUBDIR=".scheduler"

# ===========================================================================
# TIER 1 -- bug sweeper: DISABLED. No live tracker.
# ===========================================================================
SWEEP_JOB_NAME=""

# ===========================================================================
# TIER 2 -- overnight batch: paced participant (see schedule/_paced.conf).
# No .claude/commands slash command exists (gate above), so the prompt
# points at the tracked instructions file.
# ===========================================================================
BATCH_JOB_NAME="quatre-vingt-douze-nightly-batch"
BATCH_PROMPT="Read .scheduler/nightly-batch.md and follow it exactly -- it is this project's nightly-batch command. Read .scheduler/FOCUS.md before building anything. This is a fully unattended run: hold the politeness invariants in README.md (one source, sequential, rate-limited, <=40 fetches/run) and never automate the arranging."
BATCH_CRON="auto"
BATCH_MAX_TURNS="100"

# AUTONOMY_TIER "high": everything it touches is code, cached public-domain
# text, and a static gallery -- reversible; the only external effect is
# bounded, rate-limited fetching of individual public-domain files.
AUTONOMY_TIER="high"
