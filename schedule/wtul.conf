# wtul's schedule entry. JOB_NAME/PROJECT_KEY here match
# ~/.local/bin/wtul-batch-loop.sh exactly.
#
# No Tier 1 (bug-sweep) - wtul is a personal CLI/hardware tool with no
# live web tracker for a fast sweep to read from (see the wrapper
# script's own header comment).
#
# BATCH_CRON: confirmed with Zach - Wednesday and Saturday, early AM.
# Cron's day-of-week field takes a comma list, so one line covers both
# (3 = Wednesday, 6 = Saturday) - no bi-weekly workaround needed, and
# twice a week clears the shared engine's default 7-day EXPIRY_DAYS
# comfortably (wrapper still sets 14 for extra margin, no need to change
# it). Edit this line, then run bin/sync-crontab.sh --apply.

PROJECT="wtul"
PROJECT_REPO_PATH="/home/zach/Documents/wtul"

# 2026-07-27 (wtul-batch run 24): wtul's FOCUS.md/QUESTIONS.md moved from
# .claude/ to .scheduler/ (wtul repo 9539e30) -- the migration decided
# 2026-07-24 and queued as the first project in realisateur's
# ecosystem-wide pass. Without this line sync-crontab.sh would keep
# pointing focus/wtul.md and questions/wtul.md at the now-nonexistent
# .claude/ paths. Same design as chezz/aedile/realisateur.
SCHEDULER_SUBDIR=".scheduler"

SWEEP_JOB_NAME=""
SWEEP_SCRIPT=""
SWEEP_CRON=""

# Runtime config for bin/scheduler-run, migrated from
# ~/.local/bin/wtul-batch-loop.sh (MIGRATION.md step 1, 2026-07-24).
# BATCH_SCRIPT below is still set, so it stays authoritative for now (see
# sync-crontab.sh precedence) -- these fields are inert until a human drops
# BATCH_SCRIPT and re-runs sync-crontab.sh --apply to flip the switch.
REPO_URL="git@github-wtul-deploy:hf7y/wtul.git"
REPO_SUBDIR="."
BATCH_MAX_TURNS="200"
BATCH_EXPIRY_DAYS="14"   # extra margin over the engine's default 7 - not
                          # needed at twice-a-week, kept anyway as headroom
BATCH_PROMPT="/wtul-batch

This is a fully unattended run with no human review step. Read
.scheduler/FOCUS.md FIRST - that file is this project's backlog
(ROADMAP.md is a retired stub that only points back at it, and there is
no separate web tracker for this project). Re-read
.claude/commands/wtul-batch.md's own hardware-constraint section before
touching anything that talks to a real optical drive - this machine may
not have one attached, and there is no physical disc to insert during
an unattended run.

Write your report to ~/reports/wtul/\$(date +%Y-%m-%d).md and update
~/reports/wtul/LATEST.md to match it, so it is a 30-second read the next
time this machine boots up, covering: what shipped, what's still pending
hands-on hardware verification, what was deliberately deferred and why,
and any open questions that need a human decision. Confirm everything is
committed and pushed to origin/main before finishing - a run that isn't
saved anywhere didn't happen."

BATCH_JOB_NAME="wtul-batch"
BATCH_SCRIPT="/home/zach/.local/bin/wtul-batch-loop.sh"
BATCH_CRON="14 3 * * 3,6"

# TEST_CMD (2026-07-25, autonomy-merge gate): existing pytest suite
# (tests/test_spinitron.py, test_wiring.py, ...). BATCH_SCRIPT above means
# this project runs through the legacy wtul-batch-loop.sh wrapper, not
# bin/scheduler-run -- lib/sweep-loop-common.sh reads this field straight
# out of this conf file at runtime (see its AUTONOMY_TIER fallback block),
# no wrapper edit needed.
BATCH_TEST_CMD="pytest -q"

# AUTONOMY_TIER (raised 2026-07-25, human-directed: "these are not risky
# changes that need me at the gate" -- see lib/autonomy-merge.sh, built
# same day to actually enforce this field). Was "low" since 2026-07-24
# (declared, unenforced). Gated on BATCH_TEST_CMD above, not ungated.
AUTONOMY_TIER="high"
