# vkv23 -- vaporwave self-dev, registered 2026-09-03 (realisateur#695).
#
# WHAT IT IS: Shell, 2.5 MB. No description on the repo and no issues.
#
# SCOPE IS THE ISSUE QUEUE, DELIBERATELY. Nobody has written down what this
# project is for in a form this conf could cite, so the prompt below does not
# invent one. An empty queue is a DONE, not an invitation to find work --
# hf7y/scheduler#535 is where the decision about purpose belongs.
#
# THE THERMOSTAT ALREADY MAKES THIS CHEAP. bin/tempo.sh sets the real interval
# from the backlog: want = 120*12/max(1,drive), clamped to [20, 1440]. With 0
# actionable issues the drive is 0 and this paces at 1440 min -- once a day,
# the slowest the thermostat can ask for. The ROSTER rate is the ceiling only.
#
# ITS OWN QUOTA. vaporwave holds a second Anthropic account, so a run here does
# not spend the estate fleet's weekly budget.
PROJECT="vkv23"
PROJECT_KEY="vkv23"
CRON_HOST="vaporwave"
CRON_ACCOUNT="vkv23"
PROJECT_REPO_PATH="$HOME/Documents/Projects/vkv23"
REPO_URL="https://github.com/hf7y/vkv23.git"
REPO_SUBDIR="."
ANSWER_CHANNEL="issues"
SWEEP_JOB_NAME=""
BATCH_JOB_NAME="vkv23-nightly-batch"
BATCH_PROMPT="@@FRAGMENT:run-procedure@@
Your queue is hf7y/vkv23's open issues, and it IS the scope.
DO NOT invent a purpose for this project. Nobody has written one down, and
guessing produces work no one asked for -- hf7y/scheduler#535 records that
deciding what this project is for is Zach's, filed as issues on this repo.
Work ONE issue, close it, open a PR against main.
If the queue is genuinely empty, record DONE and stop. That is the expected
outcome here, not a failure to find something."
BATCH_MAX_TURNS="120"
USES_STANDING_RULES=1
