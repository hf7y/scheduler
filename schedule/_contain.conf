# Global containment defaults for the claude invocation (hf7y/scheduler#281),
# read by bin/scheduler-run and consumed by lib/sweep-loop-common.sh's
# run_contained(). Optional -- these are also that function's own built-in
# defaults, so this file only needs to exist once you want to change them
# fleet-wide. Same shape as schedule/_batch.conf: a global default, with a
# per-host schedule/_contain.<host>.conf sourced AFTER this one so it wins
# per field it sets (same pattern as schedule/_runner.<host>.conf).
#
# CONSERVATIVE for a 4 vCPU / 6 GB host (monkey, the 2026-08-23 lockup this
# issue is named for) -- these are the fallback for a host nobody has tuned
# yet, not a value to trust blindly on a bigger or smaller box. Tune per-host
# in schedule/_contain.<host>.conf, not here.
CONTAIN_CPU_QUOTA="150%"
CONTAIN_MEM_MAX="3G"
