# crt -- REGISTERED 2026-08-05, Zach-directed ("register the other five"),
# alongside arming chezz. Registration makes a project a known participant --
# what install-verbs.sh's "registered" column reads. ARMING is a separate fact
# and it lives in schedule/ROSTER's `state` column, which usage-paced-runner.sh
# reads at dispatch. WITNESS: tests/paced-roster-authority-witness.sh.
#
# PROBED 2026-08-05 rather than assumed:
#   * hf7y/crt -- PRIVATE, default branch `main`, last pushed 2026-07-30.
#   * carries a `bashified` branch, and therefore declares a verb.
#   * also carries a `voice` branch; `main` is the default and is current.
#
# BRANCH NAME IS LOAD-BEARING AND scheduler CANNOT PIN IT. There is no
# BATCH_BRANCH field anywhere in this repo -- `scheduler-run` resolves the
# repository's DEFAULT branch when nothing says otherwise. That is exactly
# realisateur#39: vim-arcade's default was `tmux-pane-mechanic`, a PR merged
# into it, and its content was absent from main while both sides reported
# success. Recorded here because this project's default is `main`, so anyone
# arming it must confirm that is still the branch the work is on.

PROJECT="crt"
PROJECT_KEY="crt"
# Self-dev lives on monkey (realisateur/MONKEY.md). CRON_HOST keeps mandark from
# emitting these lines; CRON_ACCOUNT is STATE ownership (scheduler#33 -- four
# monkey jobs read 7-12d idle while running daily because no conf set it).
CRON_HOST="monkey"
CRON_ACCOUNT="crt"
PROJECT_REPO_PATH="$HOME/Documents/Projects/crt"
REPO_URL="https://github.com/hf7y/crt.git"
REPO_SUBDIR="."
# .scheduler/, not the default .claude/: an UNATTENDED run cannot write under
# .claude/ (harness sensitive-file gate) and would read its own brief while
# silently failing to record anything. Files moved by hf7y/crt PR (2026-08-12);
# this line is the half that makes sync-crontab.sh and `scheduler` look there.
SCHEDULER_SUBDIR=".scheduler"
SWEEP_JOB_NAME=""
# TIER 2 ARMED 2026-08-05 (Zach-directed: "get dev off mandark tonight"; crt
# named first on the sprint doc's own readiness table, SPRINT-RECORD section 9).
#
# These two values were blank until tonight, and the blank was load-bearing:
# sync-crontab.sh enables the batch tier unless BATCH_JOB_NAME, BATCH_SCRIPT and
# BATCH_CRON are ALL empty (bin/sync-crontab.sh:678); with any one of them set
# and NO PACED ROW TO SUPPRESS IT, the project gets a FIXED nightly cron line.
# On 2026-08-05 that is exactly what happened: five projects were written with
# BATCH_JOB_NAME + BATCH_CRON="auto" and five nightly lines were installed in
# chezz's crontab on monkey for projects with no clone and no FOCUS.md.
#
# So these values are safe ONLY alongside the crt row in _paced.monkey.conf,
# added in the same commit. Setting them without that row re-creates the
# 2026-08-05 bug. `sync-crontab.sh` was previewed before --apply and emitted
# exactly one RUNNER line and no fixed nightly line, which is the witness that
# the suppression worked.
#
# Preconditions verified on monkey before arming, not assumed:
#   - account crt exists, scheduler clone at origin/main, tree clean
#   - brief present at .claude/FOCUS.md (crt set no SCHEDULER_SUBDIR, so
#     sync-crontab.sh defaulted to .claude -- that was where it looked)
#     SUPERSEDED 2026-08-12: the brief moved to .scheduler/FOCUS.md (hf7y/crt
#     PR #4) and SCHEDULER_SUBDIR is set above. The old location was readable
#     but NOT writable by an unattended run -- .claude/** is behind the
#     harness sensitive-file gate -- so "brief present" was true and half the
#     loop was still shut.
#   - default branch is `main` and origin/HEAD agrees, so the agent reads and
#     pushes the same branch the brief lives on (the groc-mangr#2 trap)
#   - credentials live: `claude -p 'reply ok'` returned ok as user crt under a
#     stripped, cron-shaped environment
BATCH_JOB_NAME="crt-nightly-batch"
# CONVERTED (hf7y/realisateur#744): the nightly-batch procedure was written
# out once per project -- eleven near-identical copies of one seven-step
# routine. It is schedule/_run-procedure.md now, spliced in by bin/scheduler-run's
# @@FRAGMENT:@@ carrier, and only what THIS project alone needs stays below.
# Fragments are substituted AFTER this file is sourced, so a $VAR inside one
# reaches the agent as literal text; anything that must expand belongs here.
BATCH_PROMPT="@@FRAGMENT:run-procedure@@

  gh issue list --repo hf7y/crt --state open --search '-label:needs-host -label:needs-human'
The two exclusions are the queue, not a suggestion. \`needs-host\` means the
issue cannot be finished from a dev account -- it needs a physical device or a
live remote host. crt is DEV: it VENDORS what runs on dexter and potato and
does not operate them, so owning an issue and being able to close it are
different things. Do not route around the filter by listing issues without it.
When you have finished -- and BEFORE you stop -- record a verdict, so the
scheduler can tell a finished run from a truncated one:
  \$HOME/Documents/Projects/scheduler/bin/verdict.sh set crt <VERDICT> \"<one line why>\"
  CONTINUE   there is ACTIONABLE work left.
  DONE       the bar in the brief is met, or nothing is actionable right now.
  IMPOSSIBLE a real dead end, and further tries will not help.
Recording nothing is treated as NOT-DONE and re-dispatched."
BATCH_CRON="auto"
BATCH_MAX_TURNS="120"
USES_STANDING_RULES=1
