PROJECT="secretaire"
PROJECT_KEY="secretaire"
# Self-dev lives on monkey (realisateur/MONKEY.md). CRON_HOST keeps mandark from
# emitting these lines; CRON_ACCOUNT is STATE ownership (scheduler#33 -- four
# monkey jobs read 7-12d idle while running daily because no conf set it).
CRON_HOST="monkey"
CRON_ACCOUNT="secretaire"
PROJECT_REPO_PATH="$HOME/Documents/Projects/secretaire"
REPO_URL="https://github.com/hf7y/secretaire.git"
REPO_SUBDIR="."
ANSWER_CHANNEL="issues"
SWEEP_JOB_NAME=""
BATCH_JOB_NAME="secretaire-nightly-batch"
BATCH_PROMPT="@@FRAGMENT:run-procedure@@

READ hf7y/secretaire#1 BEFORE DOING ANYTHING. This project was de-animated and
Zach decided on 2026-08-28 to re-animate it; #1 is that decision rewritten as
the build ticket, and it is the scope.
Your queue is:
  gh issue list --repo hf7y/secretaire --state open --search '-label:needs-host -label:needs-human'
The two exclusions are the queue, not a suggestion. \`needs-host\` means the
issue cannot be finished from this dev seat -- it needs a physical device or a
live remote host (dexter, right now). Re-checking an excluded issue's wall by
hand once in a while is fine; treating it as tonight's queue item is not. Do
not route around the filter by listing issues without it.
Work ONE issue, close it, open a PR against main. Do not invent a purpose for
this project -- #1 says saying what it is for is Zach's, filed as issues here.
If the queue is genuinely empty, record DONE and stop."
BATCH_MAX_TURNS="120"
USES_STANDING_RULES=1
