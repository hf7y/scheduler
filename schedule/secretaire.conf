# "re-animate, park, or unregister". The condition this header used to name --
# "an issue filed on hf7y/secretaire, or a decision to re-animate" -- is met,
# so the brief no longer tells the run to record DONE and stop. That
# instruction was correct for an empty queue and is now the thing that would
