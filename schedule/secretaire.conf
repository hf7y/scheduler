#
# QUEUE FILTER added 2026-09-21, mirroring crt.conf. #38 and #40 hit the same
# wall crt#318 already carries `needs-host` for -- no route from a monkey dev
# seat to dexter (ssh refused, tailscaled inactive, no sudo to start it) -- and
# six-plus consecutive nightly sessions (2026-09-16 through 2026-09-20)
# reconfirmed it identically with nothing new to add. Both issues now carry
# `needs-host` on hf7y/secretaire; the filter below stops the batch prompt from
