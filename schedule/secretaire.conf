# secretaire -- REGISTERED AND ROTATED 2026-08-12, Zach-directed ("move
# sequestria, groc-mangr, crt, secretaire and ensure they will trigger when the
# gate opens"). Sibling confs: sequestria, groc-mangr, crt, done in the same
# pass.
#
# SAY THE AWKWARD THING FIRST, because the next reader will otherwise discover
# it at 03:00 from a run log. hf7y/secretaire IS DE-ANIMATED. Its own README,
# reaped 2026-07-31, opens "This project is de-animated. Nothing runs here":
# main is a pointer, the verb (`range`) lives on the `bashified` branch, the
# prose is in ecosystem1-vault, and its one retired half (`trie`) is recorded
# as a REFUSAL, not a backlog item. Probed 2026-08-12: main is one README,
# `bashified` is the only other branch, and the open-issue queue is EMPTY.
#
# So this conf is complete and correct and there is nothing for it to do. That
# is not a defect to route around by inventing a brief -- the brief below tells
# the run to record DONE and stop, which is the honest outcome for a queue with
# nothing in it. What it is NOT is a bare "/nightly-batch" idea-inference pass:
# that is the exact shape Zach corrected on 2026-08-06 (#59), and pointed at a
# de-animated repo it would manufacture work for the sake of looking busy.
#
# WHAT WOULD MAKE THIS ROW WORTH ITS TICK: an issue filed on hf7y/secretaire,
# or a decision to re-animate the project. Until then the row costs one stat(2)
# and a FROZEN log line per tick and dispatches nothing, because there is no
# EXEMPT line for it in schedule/FREEZE.

PROJECT="secretaire"
PROJECT_KEY="secretaire"
# Self-dev lives on monkey (realisateur/MONKEY.md). CRON_HOST keeps mandark from
# emitting these lines; CRON_ACCOUNT is STATE ownership (scheduler#33 -- four
# monkey jobs read 7-12d idle while running daily because no conf set it).
CRON_HOST="monkey"
CRON_ACCOUNT="secretaire"
PROJECT_REPO_PATH="$HOME/Documents/Projects/secretaire"
REPO_URL="https://github.com/hf7y/secretaire.git"
REPO_SUBDIR="."
ANSWER_CHANNEL="issues"
SWEEP_JOB_NAME=""
BATCH_JOB_NAME="secretaire-nightly-batch"
BATCH_PROMPT="/nightly-batch
READ THIS BEFORE DOING ANYTHING. This project is DE-ANIMATED (see its README).
Do not infer work for it, do not restart it, and do not write a note about it.
Your whole run is:
  gh issue list --repo hf7y/secretaire --state open
If that is empty, record DONE with the reason 'de-animated, empty queue' and
stop. If it is not empty, somebody filed something deliberately: work ONE
issue, close it, open a PR against main.
When you have finished -- and BEFORE you stop -- record a verdict, so the
scheduler can tell a finished run from a truncated one:
  \$HOME/Documents/Projects/scheduler/bin/verdict.sh set secretaire <VERDICT> \"<one line why>\"
  CONTINUE   there is ACTIONABLE work left.
  DONE       the bar in the brief is met, or nothing is actionable right now.
  IMPOSSIBLE a real dead end, and further tries will not help.
Recording nothing is treated as NOT-DONE and re-dispatched."
BATCH_CRON="auto"
BATCH_MAX_TURNS="120"
AUTONOMY_TIER="medium"
USES_STANDING_RULES=1
