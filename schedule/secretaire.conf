# secretaire -- multi-account email triage (~7 gmail + 1 outlook).
# Scaffolded by realisateur 2026-07-26 from secretaire.idea. Registered
# 2026-07-26, but PARKED (enabled=0) in schedule/_paced.conf at scaffold
# time -- a stated choice, not an oversight: the drop's own three-way fork
# (grant-access service vs credential-free utilities vs managed
# Thunderbird) is Zach's decision, and every remaining stability-milestone
# item is a human step (inventory fill, lane decision, one human-session
# read-only triage pass). Flip the _paced.conf line to enabled=1 when a
# `> ` answer in the repo's .scheduler/QUESTIONS.md gives the nightly real
# scope.
#
# HARD RULE (stamped in the repo's CLAUDE.md and nightly-batch.md): no
# email credential, token, or account access is ever provisioned, stored,
# or exercised unattended, and nothing ever sends. If lane 1 (grant
# access) is chosen someday, its credential half is human-only and secrets
# live untracked -- aedile's draft-only/allowlist/kill-switch model is the
# named precedent.

PROJECT="secretaire"
PROJECT_KEY="secretaire"

PROJECT_REPO_PATH="/home/zach/Documents/Projects/secretaire"

REPO_URL="/home/zach/git-remotes/secretaire.git"
REPO_SUBDIR="."

# Scheduler-facing files live in .scheduler/, not .claude/ -- unattended
# runs can't write .claude/ (sensitive-file gate).
SCHEDULER_SUBDIR=".scheduler"

# ===========================================================================
# TIER 1 -- bug sweeper: DISABLED. No live tracker.
# ===========================================================================
SWEEP_JOB_NAME=""

# ===========================================================================
# TIER 2 -- overnight batch: registered as a (parked) paced participant.
# No .claude/commands slash command exists (gate above), so the prompt
# points at the tracked instructions file.
# ===========================================================================
BATCH_JOB_NAME="secretaire-nightly-batch"
BATCH_PROMPT="Read .scheduler/nightly-batch.md and follow it exactly -- it is this project's nightly-batch command. Read .scheduler/FOCUS.md before doing anything. This is a fully unattended run: never provision, store, or exercise any email credential or account access; never send; a run that finds no new answered question should verify state and end cheaply."
BATCH_CRON="auto"
BATCH_MAX_TURNS="60"

# AUTONOMY_TIER "low": the project is design/docs/offline-utilities until
# Zach decides the lane; everything credential-shaped is human-only.
AUTONOMY_TIER="low"
