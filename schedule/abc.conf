# abc -- music for the Abecedarian trilogy: three feature films meant to play
# simultaneously. This repo holds the LilyPond notation; the media and the
# film's data model live on dexter, referenced from the repo's README.
# Registered 2026-09-23, standing-up tracked in hf7y/realisateur#1277.
#
# Follows the gardien precedent: generic bin/scheduler-run entrypoint, joins
# the usage-paced governor as a Tier 2 participant rather than a fixed cron
# time.
#
# Its queue is real before it dispatches: 10 open issues across 4 milestones,
# and a `prose / prose` check required on main, so a run has gated work to do
# rather than an empty tracker.

PROJECT="abc"
PROJECT_KEY="abc"

CRON_HOST="monkey"
CRON_ACCOUNT="abc"
SELFDEV_IN_ACCOUNT=0

PROJECT_REPO_PATH="$HOME/Documents/Projects/abc"
REPO_URL="https://github.com/hf7y/abc.git"
REPO_SUBDIR="."

# The default branch is `main`, renamed from `master` 2026-09-23 so the two
# mechanisms that read a literal `main` -- etalon's guard.yml fetch and
# scheduler-run's default-branch resolution (the #39 trap) -- both resolve.

SWEEP_JOB_NAME=""
BATCH_JOB_NAME="abc-nightly-batch"
BATCH_PROMPT="@@FRAGMENT:run-procedure@@"
BATCH_MAX_TURNS="120"
USES_STANDING_RULES=1
