# sequestria -- REGISTERED 2026-08-05, Zach-directed ("register the other five"),
# alongside arming chezz. Registered is not armed: there is NO row for this
# project in any schedule/_paced*.conf and no EXEMPT line in schedule/FREEZE,
# so nothing dispatches it. Registration makes it a known participant --
# which is what install-verbs.sh's "registered" column reads, and what makes
# its declared verb accountable to something.
#
# WHY IT WAS NOT ARMED. Three preconditions are unmet, and each would produce
# a specific failure rather than a slow start:
#   1. No .scheduler/ directory in the repo -- no FOCUS.md, no QUESTIONS.md.
#      BATCH_PROMPT below runs /nightly-batch, which builds against FOCUS.md's
#      stated priorities. With no FOCUS.md there is nothing to build against.
#   2. No unix account on monkey. An enabled row whose command path does not
#      exist makes every runner log "SKIP sequestria -- command not runnable" on
#      EVERY tick -- ~48 lines a night at the current 0,30 cadence, in the
#      same run.log someone is reading to see how the night went. Stand the
#      account up first with realisateur bin/setup-selfdev-project.sh.
#   3. Arming spends a shared weekly quota. That is a judgment, and every
#      guard in this ecosystem stops one step short of it.
#
# PROBED 2026-08-05 rather than assumed:
#   * hf7y/sequestria -- PRIVATE, default branch `main`, last pushed 2026-07-30.
#   * carries a `bashified` branch, and therefore declares a verb.
#
# BRANCH NAME IS LOAD-BEARING AND scheduler CANNOT PIN IT. There is no
# BATCH_BRANCH field anywhere in this repo -- `scheduler-run` resolves the
# repository's DEFAULT branch when nothing says otherwise. That is exactly
# realisateur#39: vim-arcade's default was `tmux-pane-mechanic`, a PR merged
# into it, and its content was absent from main while both sides reported
# success. Recorded here because this project's default is `main`, so anyone
# arming it must confirm that is still the branch the work is on.

PROJECT="sequestria"
PROJECT_KEY="sequestria"
# Self-dev lives on monkey (realisateur/MONKEY.md). CRON_HOST keeps mandark from
# emitting these lines; CRON_ACCOUNT is STATE ownership (scheduler#33 -- four
# monkey jobs read 7-12d idle while running daily because no conf set it).
CRON_HOST="monkey"
CRON_ACCOUNT="sequestria"
PROJECT_REPO_PATH="$HOME/Documents/Projects/sequestria"
REPO_URL="https://github.com/hf7y/sequestria.git"
REPO_SUBDIR="."
# .scheduler/, not the default .claude/: an UNATTENDED run cannot write under
# .claude/ (harness sensitive-file gate) and would read its own brief while
# silently failing to record anything. Files moved by hf7y/sequestria PR (2026-08-12);
# this line is the half that makes sync-crontab.sh and `scheduler` look there.
SCHEDULER_SUBDIR=".scheduler"
SWEEP_JOB_NAME=""
# TIER 2 RESTORED 2026-08-12, Zach-directed ("move sequestria, groc-mangr, crt,
# secretaire and ensure they will trigger when the gate opens"). It was blank
# because on 2026-08-05 five such confs put FIXED nightly lines into chezz's
# crontab for projects with no clone and no FOCUS.md. That cannot recur here:
# this project now has an account, a clone and an ENABLED row in
# schedule/_paced.monkey.conf, and membership in that rotation is exactly what
# suppresses the fixed line (bin/sync-crontab.sh, "MEMBERSHIP ALONE SUPPRESSES").
# BATCH_JOB_NAME is still required -- `scheduler-run <p> batch` exits 2 without
# it -- so a blank one is not "unarmed", it is "armed and broken".
#
# WHAT ACTUALLY HOLDS IT SHUT: schedule/FREEZE. There is no EXEMPT line for this
# project, so freeze-check.sh refuses at dispatch and the runner logs FROZEN.
# Opening that one line is the only remaining act.
BATCH_JOB_NAME="sequestria-nightly-batch"
BATCH_PROMPT="/nightly-batch
FIRST, work the issue queue -- it is the queue Zach actually files into, and
it is not visible from .scheduler/FOCUS.md:
  gh issue list --repo hf7y/sequestria --state open
Pick ONE issue you can finish tonight, finish it, and close it in the same
run with a comment saying what landed and where. Triage is not FIFO: an
issue whose premise has expired should be closed with the reason, and that
is real work. If nothing in the queue is actionable, say so plainly and
record DONE -- an honest empty run beats an invented one.
When you have finished -- and BEFORE you stop -- record a verdict, so the
scheduler can tell a finished run from a truncated one:
  \$HOME/Documents/Projects/scheduler/bin/verdict.sh set sequestria <VERDICT> \"<one line why>\"
  CONTINUE   there is ACTIONABLE work left.
  DONE       the bar in the brief is met, or nothing is actionable right now.
  IMPOSSIBLE a real dead end, and further tries will not help.
Recording nothing is treated as NOT-DONE and re-dispatched."
BATCH_CRON="auto"
BATCH_MAX_TURNS="120"
USES_STANDING_RULES=1
